<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Outer badge frame -->
  <defs>
    <linearGradient id="nerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="396" height="116" rx="12" fill="url(#darkBg)" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Left Shield Emblem -->
  <g transform="translate(24, 18)">
    <path d="M42 0 L84 15 L84 50 Q84 80 42 88 Q0 80 0 50 L0 15 Z" fill="#18181B" stroke="url(#nerGold)" stroke-width="2.5" />
    <!-- Winged accents inside shield -->
    <path d="M14 36 L42 22 L70 36 L42 30 Z" fill="url(#nerGold)" opacity="0.9" />
    <text x="42" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NER</text>
    <circle cx="42" cy="72" r="3" fill="#F59E0B" />
  </g>

  <!-- Text typography -->
  <g transform="translate(130, 28)">
    <!-- Subtitle / Origin -->
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="4">EST. NAGPUR • ZERO MILE</text>
    <!-- Brand Title -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FAFAFA" letter-spacing="1.5">NAGPUR ENFIELD</text>
    <text x="0" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#D4D4D8" letter-spacing="6">RIDERS</text>
  </g>

  <!-- Accent corner indicator -->
  <line x1="370" y1="20" x2="385" y2="20" stroke="#F59E0B" stroke-width="2" />
  <line x1="385" y1="20" x2="385" y2="35" stroke="#F59E0B" stroke-width="2" />
</svg>
