        ? `Match Drawn (${g.terminationReason || 'Agreement'})`
        : `${g.winner === 'w' ? 'White' : 'Black'} Wins (${g.terminationReason || 'Victory'})`;

      return `
        <div class="interactive-panel" style="padding:26px 32px;text-align:center;max-width:420px;border-color:var(--border-gold);">
          <div class="eyebrow-tag" style="margin:0 auto 10px auto;">${escapeHtml(headline)}</div>
          <h2 class="hero-headline" style="font-size:26px;margin-bottom:6px;">${escapeHtml(subline)}</h2>
          <p style="color:var(--text-secondary);font-size:13px;margin-bottom:18px;">
            ${g.moveCount || g.moves.length} moves • Duration ${formatDuration(g.duration)} • Result ${escapeHtml(g.result)}
          </p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">

          </div>
        </div>
      </div>
    `;
  }

  _renderModal() {
    if (this.activeModal === 'SETUP') return this._renderSetupModal();
    if (this.activeModal === 'HISTORY') return this._renderHistoryModal();
    if (this.activeModal === 'STATS') return this._renderStatsModal();
    if (this.activeModal === 'CUSTOMIZE') return this._renderCustomizeModal();

    if (this.activeModal === 'PGN') return this._renderPgnModal();
    if (this.activeModal === 'HELP') return this._renderHelpModal();
    return '';
  }

  _renderHistoryModal() {
    let games = GameStorage.getAllSync();

    // Filter
    if (this.historyFilter === 'Wins') {
      games = games.filter((g) => g.winner === (g.playerColor || 'w'));
    } else if (this.historyFilter === 'Losses') {
      games = games.filter(
        (g) => g.status === 'completed' && g.winner && g.winner !== 'draw' && g.winner !== (g.playerColor || 'w')
      );
    } else if (this.historyFilter === 'Draws') {
      games = games.filter((g) => g.winner === 'draw' || g.result === '1/2-1/2');
    } else if (this.historyFilter === 'AI') {
      games = games.filter((g) => g.mode === GameMode.AI);
    } else if (this.historyFilter === 'Local') {
      games = games.filter((g) => g.mode === GameMode.LOCAL);
    } else if (this.historyFilter === 'Recent') {
      games = games.slice(0, 10);
    }

    // Search
    if (this.historySearch.trim()) {
      const q = this.historySearch.trim().toLowerCase();
      games = games.filter(
        (g) =>
          (g.whitePlayer || '').toLowerCase().includes(q) ||
          (g.blackPlayer || '').toLowerCase().includes(q) ||
          (g.pgn || '').toLowerCase().includes(q) ||
          String(g.gameNumber || '').includes(q)
      );
    }

    // Sort
    if (this.historySort === 'Oldest') {
      games.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    } else if (this.historySort === 'Longest') {
      games.sort((a, b) => (b.duration || 0) - (a.duration || 0));
    } else if (this.historySort === 'Most moves') {
      games.sort((a, b) => (b.moveCount || 0) - (a.moveCount || 0));
    } else {
      games.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    }

    return `
      <div class="modal-backdrop">
        <div class="modal-window">
          <div class="modal-header">
            <div class="modal-title">Local Game History (IndexedDB)</div>
            <button class="icon-btn" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;">
              <div style="display:flex;flex-wrap:wrap;gap:4px;">
                ${['All', 'Wins', 'Losses', 'Draws', 'AI', 'Local', 'Recent']
                  .map(
                    (f) =>
                      `<button class="btn btn-sm ${this.historyFilter === f ? 'active-preset' : ''}" data-action="history-filter" data-filter="${f}">${f}</button>`
                  )
                  .join('')}
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <input type="text" class="input-control" id="history-search-input" placeholder="Search player or move..." value="${escapeHtml(this.historySearch)}" style="width:170px;" />
                <select class="select-control" id="history-sort-select">
                  ${['Newest', 'Oldest', 'Longest', 'Most moves']
                    .map(
                      (s) =>
                        `<option value="${s}" ${this.historySort === s ? 'selected' : ''}>Sort: ${s}</option>`
                    )
                    .join('')}
                </select>
              </div>
            </div>

            <div class="history-list">
              ${
                games.length === 0
                  ? `<div style="text-align:center;padding:32px;color:var(--text-secondary);">No saved games match the current filter. All matches are saved automatically to your browser’s local storage.</div>`
                  : games
                      .map((g) => {
                        const isWin = g.winner === (g.playerColor || 'w');
                        const isDraw = g.winner === 'draw' || g.result === '1/2-1/2';
                        const badgeClass =
                          g.status === 'in_progress'
                            ? 'badge-active'
                            : isDraw
                            ? 'badge-draw'
                            : isWin
                            ? 'badge-win'
                            : 'badge-loss';
                        const badgeLabel =
                          g.status === 'in_progress'
                            ? 'IN PROGRESS'
                            : isDraw
                            ? 'DRAW'
                            : isWin
                            ? 'WIN'
                            : 'LOSS';
                        const dateStr = new Date(g.updatedAt).toLocaleDateString(undefined, {
                          month: 'short',
                          day: 'numeric',
                          hour: '2-digit',
                          minute: '2-digit',
                        });
                        return `
                          <div class="history-card">
                            <div>
                              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                                <strong style="color:var(--accent-gold-bright)">GAME #${g.gameNumber || 1}</strong>
                                <span class="badge ${badgeClass}">${badgeLabel}</span>
                                <span style="font-size:12px;color:var(--text-secondary)">${dateStr}</span>
                              </div>
                              <div style="font-size:13px;">
                                White: <strong>${escapeHtml(g.whitePlayer)}</strong> • Black: <strong>${escapeHtml(g.blackPlayer)}</strong>
                              </div>
                              <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;">
                                ${g.mode === 'ai' ? `Difficulty: ${g.aiDifficulty} • ` : ''}Moves: ${g.moveCount || (g.moves ? g.moves.length : 0)} • Duration: ${formatDuration(g.duration)} • Theme: ${escapeHtml(g.theme)}
                              </div>
                            </div>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                              ${
                                g.status === 'in_progress'
                                  ? `<button class="btn btn-sm btn-gold" data-action="continue-game" data-id="${g.id}">Continue</button>`
                                  : ''
                              }
                              <button class="btn btn-sm" data-action="replay-game" data-id="${g.id}">Replay</button>
                              <button class="btn btn-sm" data-action="analyze-game" data-id="${g.id}">Analyze</button>
                              <button class="btn btn-sm" data-action="continue-game" data-id="${g.id}">View</button>
                              <button class="btn btn-sm btn-danger" data-action="delete-game" data-id="${g.id}">Delete</button>
                            </div>
                          </div>
                        `;
                      })
                      .join('')
              }
            </div>
          </div>
          <div class="modal-footer">
            <span style="margin-right:auto;font-size:11.5px;color:var(--text-secondary);">Local-first privacy: game records are stored solely in your browser.</span>
            <button class="btn" data-action="close-modal">Close</button>
          </div>
        </div>
      </div>
    `;
  }

              <option value="black" ${s.board.boardRotation === 'black' ? 'selected' : ''}>Black Bottom</option>

          </div>

      tabContent = `

            <input type="range" min="0.4" max="2.0" step="0.1" value="${s.camera.zoomSensitivity}" data-action="range-setting" data-cat="camera" data-key="zoomSensitivity" />

    } else if (this.settingsTab === 'GRAPHICS') {
      const items = [
        ['shadows', '3D Projected Shadows'],
        ['reflections', 'Planar Board Reflections'],
        ['bloom', 'Cinematic Bloom Glow'],

      tabContent = `
        <div class="toggle-row">

              .map(

              .join('')}

        </div>
        ${items
          .map(
            ([key, label]) => `
          <div class="toggle-row">
            <span>${label}</span>
            <button class="btn btn-sm ${s.graphics[key] ? 'btn-gold' : ''}" data-action="toggle-setting" data-cat="graphics" data-key="${key}">
              ${s.graphics[key] ? 'ON' : 'OFF'}
            </button>
          </div>
        `
          )
          .join('')}
      `;
    } else if (this.settingsTab === 'AUDIO') {
      const items = [
        ['muted', 'Mute All Audio (Shortcut: M)'],
        ['music', 'Ambient Background Drone Music'],
        ['moveSound', 'Piece Movement Sounds'],
        ['captureSound', 'Capture Impact Sounds'],
        ['checkSound', 'Check & Victory Fanfare Sounds'],
        ['uiSound', 'UI Button Click Sounds'],
      ];
      tabContent = `
        <div class="field-group" style="margin-bottom:8px;">
          <label class="field-label">Master Volume (${Math.round(s.audio.masterVolume * 100)}%)</label>
          <input type="range" min="0" max="1" step="0.05" value="${s.audio.masterVolume}" data-action="range-setting" data-cat="audio" data-key="masterVolume" />
        </div>
        ${items
          .map(
            ([key, label]) => `
          <div class="toggle-row">
            <span>${label}</span>
            <button class="btn btn-sm ${s.audio[key] ? 'btn-gold' : ''}" data-action="toggle-setting" data-cat="audio" data-key="${key}">
              ${s.audio[key] ? 'ON' : 'OFF'}
            </button>
          </div>
        `
          )
          .join('')}
      `;
    } else if (this.settingsTab === 'ACCESSIBILITY') {
      const items = [
        ['highContrast', 'High Contrast UI & Board'],
        ['colorBlindMode', 'Color-Blind Friendly Move Indicators (Blue/Orange)'],
        ['reducedMotion', 'Reduced Motion (Instant Camera & Fast Moves)'],
        ['largerPieces', 'Larger 3D Chess Pieces (+15% Scale)'],
      ];
      tabContent = items
        .map(
          ([key, label]) => `
        <div class="toggle-row">
          <span>${label}</span>
          <button class="btn btn-sm ${s.accessibility[key] ? 'btn-gold' : ''}" data-action="toggle-setting" data-cat="accessibility" data-key="${key}">
            ${s.accessibility[key] ? 'ON' : 'OFF'}
          </button>
        </div>
      `
        )
        .join('');
    }

    return `
      <div class="modal-backdrop">
        <div class="modal-window">
          <div class="modal-header">
            <div class="modal-title">Application Settings</div>
            <button class="icon-btn" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            <div style="display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border-subtle);padding-bottom:12px;">
              ${tabs
                .map(
                  (t) =>
                    `<button class="btn btn-sm ${this.settingsTab === t ? 'btn-gold' : ''}" data-action="settings-tab" data-tab="${t}">${t}</button>`
                )
                .join('')}
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${tabContent}
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-danger" data-action="reset-settings">Reset Defaults</button>
            <button class="btn btn-gold" data-action="close-modal">Save &amp; Close</button>
          </div>
        </div>
      </div>
    `;
  }

  // --------------------------------------------------------------------------
  // DOM Event Delegation
  // --------------------------------------------------------------------------
  _attachDOMEvents(root) {
    root.querySelectorAll('[data-action]').forEach((el) => {
      const action = el.getAttribute('data-action');
      if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        this._dispatchAction(action, el);
      });
    });

    // Select & Range inputs
    root.querySelectorAll('select[data-action], input[data-action]').forEach((el) => {
      const action = el.getAttribute('data-action');
      el.addEventListener('change', () => this._dispatchAction(action, el));
    });

    // Setup Modal live form sync
    const bindSetupField = (id, key) => {
      const input = root.querySelector(id);
      if (input) {
        input.addEventListener('change', (e) => {
          this.setupForm[key] = e.target.value;
          if (key === 'mode') this.renderUI();
        });
      }
    };
    bindSetupField('#setup-mode', 'mode');
    bindSetupField('#setup-difficulty', 'aiDifficulty');
    bindSetupField('#setup-color', 'playerColor');
    bindSetupField('#setup-time', 'timeControl');
    bindSetupField('#setup-theme', 'theme');
    bindSetupField('#setup-pieceset', 'pieceSet');
    bindSetupField('#setup-env', 'environment');
    bindSetupField('#setup-fen', 'customFen');

    // History Search & Sort
    const searchInput = root.querySelector('#history-search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        this.historySearch = e.target.value;
        this.renderUI();
        const refocused = document.getElementById('history-search-input');
        if (refocused) {
          refocused.focus();
          refocused.setSelectionRange(refocused.value.length, refocused.value.length);
        }
      });
    }
    const sortSelect = root.querySelector('#history-sort-select');
    if (sortSelect) {
      sortSelect.addEventListener('change', (e) => {
        this.historySort = e.target.value;
        this.renderUI();
      });
    }
  }

  _dispatchAction(action, el) {
    switch (action) {
      case 'nav-home':
        SoundSystem.playClick();
        this.stopReplay();
        this.activeModal = null;
        this.screen = 'HOME';
        this.renderUI();
        break;
      case 'nav-game':
        SoundSystem.playClick();
        this.activeModal = null;
        if (!this.currentGame) {
          this.startNewGameFromSetup();
        } else {
          this.screen = 'GAME';
          this._sync3DScene();
          this.renderUI();
        }
        break;
      case 'nav-puzzles':
        this.openPuzzleMode();
        break;
      case 'open-modal':
        SoundSystem.playClick();
        this.activeModal = el.getAttribute('data-modal');
        this.renderUI();
        break;
      case 'close-modal':
        SoundSystem.playClick();
        this.activeModal = null;
        this.renderUI();
        break;
      case 'setup-mode':
        this.openMatchSetup(el.getAttribute('data-mode') || GameMode.AI);
        break;
      case 'launch-match':
        this.startNewGameFromSetup();
        break;
      case 'continue-game':
        this.continueSavedGame(el.getAttribute('data-id'));
        break;
      case 'replay-game':
        this.startReplayGame(el.getAttribute('data-id'));
        break;
      case 'replay-current':
        if (this.currentGame) this.startReplayGame(this.currentGame.id);
        break;
      case 'analyze-game':
        this.runGameAnalysis(el.getAttribute('data-id'));
        break;
      case 'analyze-current':
        this.runGameAnalysis();
        break;
      case 'close-analysis':
        this.activeAnalysis = null;
        this._sync3DScene();
        this.renderUI();
        break;
      case 'delete-game': {
        const id = el.getAttribute('data-id');
        GameStorage.deleteGame(id);
        if (this.currentGame && this.currentGame.id === id) {
          this.currentGame = null;
        }
        this.showToast('Saved game deleted.');
        this.renderUI();
        break;
      }
      case 'reset-camera':
        SoundSystem.playClick();
        this.scene3D.resetCamera(this.currentGame?.playerColor || 'w');
        break;
      case 'camera-preset': {
        SoundSystem.playClick();
        const presetId = el.getAttribute('data-preset');
        this.scene3D.setCameraPreset(presetId, this.currentGame?.playerColor || 'w');
        break;
      }
      case 'flip-camera-side': {
        SoundSystem.playClick();
        const isBlack = Math.cos(this.scene3D.camera.targetTheta) < 0;
        this.scene3D.rotateToSide(isBlack ? 'w' : 'b');
        break;
      }
      case 'toggle-auto-camera': {
        const next = !this.settings.gameplay.autoCamera;
        this.settings = SettingsStorage.updateCategory('gameplay', { autoCamera: next });
        this.renderUI();
        break;
      }
      case 'quick-theme':
        this.settings = SettingsStorage.updateCategory('board', { theme: el.value });
        this._sync3DScene();
        this.renderUI();
        break;
      case 'quick-pieceset':
        this.settings = SettingsStorage.updateCategory('board', { pieceSet: el.value });
        this._sync3DScene();
        this.renderUI();
        break;
      case 'quick-environment':
        this.settings = SettingsStorage.updateCategory('board', { environment: el.value });
        this._sync3DScene();
        this.renderUI();
        break;
      case 'set-board-opt': {
        SoundSystem.playClick();
        const k = el.getAttribute('data-key');
        const v = el.getAttribute('data-val');
        this.settings = SettingsStorage.updateCategory('board', { [k]: v });
        this._sync3DScene();
        this.renderUI();
        break;
      }
      case 'jump-move':
        this.stopReplay();
        this.jumpToHistoryMove(parseInt(el.getAttribute('data-index'), 10));
        break;
      case 'return-live':
        this.returnToLiveGame();
        break;
      case 'toggle-replay':
        this.toggleReplayPlay();
        break;
      case 'replay-speed':
        this.setReplaySpeed(parseFloat(el.getAttribute('data-speed')));
        break;
      case 'undo-move':
        this.handleUndoMove();
        break;
      case 'offer-draw':
        this.handleOfferDraw();
        break;
      case 'accept-draw':
        this.acceptDrawOffer();
        break;
      case 'decline-draw':
        this.declineDrawOffer();
        break;
      case 'resign-game':
        this.handleResign();
        break;
      case 'promote-select':
        this.completePromotionChoice(el.getAttribute('data-piece'));
        break;
      case 'confirm-move-yes':
        this.confirmPendingMove();
        break;
      case 'confirm-move-no':
        this.cancelPendingMove();
        break;
      case 'toggle-mute': {
        const nextMute = !this.settings.audio.muted;
        this.settings = SettingsStorage.updateCategory('audio', { muted: nextMute });
        SoundSystem.syncMusicState();
        this.renderUI();
        break;
      }
      case 'toggle-fullscreen':
        this.toggleFullscreenZen();
        break;
      case 'settings-tab':
        SoundSystem.playClick();
        this.settingsTab = el.getAttribute('data-tab');
        this.renderUI();
        break;
      case 'toggle-setting': {
        SoundSystem.playClick();
        const cat = el.getAttribute('data-cat');
        const key = el.getAttribute('data-key');
        const curVal = this.settings[cat][key];
        this.settings = SettingsStorage.updateCategory(cat, { [key]: !curVal });
        this._applySettingsClasses();
        this._sync3DScene();
        this.renderUI();
        break;
      }
      case 'select-setting': {
        const cat = el.getAttribute('data-cat');
        const key = el.getAttribute('data-key');
        this.settings = SettingsStorage.updateCategory(cat, { [key]: el.value });
        this._sync3DScene();
        this.renderUI();
        break;
      }
      case 'range-setting': {
        const cat = el.getAttribute('data-cat');
        const key = el.getAttribute('data-key');
        this.settings = SettingsStorage.updateCategory(cat, { [key]: parseFloat(el.value) });
        this._applySettingsClasses();
        this.renderUI();
        break;
      }
      case 'quality-preset':
        SoundSystem.playClick();
        this.settings = SettingsStorage.applyQualityPreset(el.getAttribute('data-quality'));
        this._applySettingsClasses();
        this._sync3DScene();
        this.renderUI();
        break;
      case 'reset-settings':
        this.settings = SettingsStorage.reset();
        this._applySettingsClasses();
        this._sync3DScene();
        this.showToast('Settings restored to default.');
        this.renderUI();
        break;
      case 'history-filter':
        this.historyFilter = el.getAttribute('data-filter');
        this.renderUI();
        break;
      case 'save-profile': {
        const input = document.getElementById('profile-username-input');
        if (input && input.value.trim()) {
          this.profile = ProfileStorage.save({
            username: input.value.trim(),
            favoriteBoard: this.settings.board.theme,
            favoritePieceSet: this.settings.board.pieceSet,
          });
          this.showToast('Profile saved locally.');
          this.renderUI();
        }
        break;
      }
      case 'copy-fen': {
        const fen = this.engine.fen();
        navigator.clipboard?.writeText(fen).catch(() => {});
        this.showToast('FEN copied to clipboard!');
        break;
      }
      case 'copy-pgn': {
        const ta = document.getElementById('pgn-textarea');
        const pgn = ta ? ta.value : this.engine.pgn();
        navigator.clipboard?.writeText(pgn).catch(() => {});
        this.showToast('PGN copied to clipboard!');
        break;
      }
      case 'download-pgn': {
        const ta = document.getElementById('pgn-textarea');
        const pgn = ta ? ta.value : this.engine.pgn();
        const blob = new Blob([pgn], { type: 'application/x-chess-pgn' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `sovereign_chess_${Date.now()}.pgn`;
        a.click();
        this.showToast('PGN file downloaded.');
        break;
      }
      case 'import-pgn': {
        const ta = document.getElementById('pgn-textarea');
        if (!ta || !ta.value.trim()) {
          this.showToast('Paste a valid PGN string first.');
          return;
        }
        const testEng = new ChessEngine();
        const res = testEng.loadPgn(ta.value.trim());
        if (!res.valid) {
          this.showToast(`Invalid PGN: ${res.error}`);
          return;
        }
        this.engine.loadPgn(ta.value.trim());
        const importedMoves = this.engine.history.map((h) => ({
          san: h.san,
          from: h.from,
          to: h.to,
          piece: h.piece,
          color: h.color,
          captured: h.captured || null,
          promotion: h.promotion || null,
          flags: h.flags,
          fenAfter: h.fenAfter,
          moveNumber: h.moveNumber,
          timestamp: h.timestamp,
        }));
        const status = this.engine.getGameStatus();
        this.currentGame = createGameRecord({
          gameNumber: GameStorage.getNextGameNumber(),
          whitePlayer: this.engine.headers.White || 'White',
          blackPlayer: this.engine.headers.Black || 'Black',
          mode: GameMode.LOCAL,
          startingFen: this.engine.startingFen,
          finalFen: this.engine.fen(),
          pgn: this.engine.pgn(),
          moves: importedMoves,
          moveCount: importedMoves.length,
          result: status.result,
          winner: status.winner,
          status: status.over ? 'completed' : 'in_progress',
        });
        GameStorage.saveGame(this.currentGame);
        this.activeModal = null;
        this.screen = 'GAME';
        this.jumpToHistoryMove(0);
        this.toggleReplayPlay(true);
        this.showToast(`Imported PGN (${importedMoves.length} half-moves) — Replaying!`);
        break;
      }
      case 'puzzle-cat':
        this.puzzleCategory = el.getAttribute('data-cat');
        this.openPuzzleMode();
        break;
      case 'select-puzzle': {
        const puz = BUILTIN_PUZZLES.find((p) => p.id === el.getAttribute('data-id'));
        if (puz) this.openPuzzleMode(puz);
        break;
      }
      case 'puzzle-hint':
        this.puzzleShowHint = true;
        this.renderUI();
        break;
      case 'puzzle-retry':
        this.openPuzzleMode(this.currentPuzzle);
        break;
      case 'puzzle-next': {
        const filtered = BUILTIN_PUZZLES.filter(
          (p) => this.puzzleCategory === 'All' || p.category === this.puzzleCategory
        );
        const idx = filtered.findIndex((p) => p.id === this.currentPuzzle.id);
        const nextPuz = filtered[(idx + 1) % filtered.length] || BUILTIN_PUZZLES[0];
        this.openPuzzleMode(nextPuz);
        break;
      }
    }
  }
}


// --- BOOTSTRAP APPLICATION ---
function bootstrapSovereignChess() {
  if (window.__sovereignChessApp) return;
  const app = new SovereignChessApp();
  window.__sovereignChessApp = app;
  app.init();
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootstrapSovereignChess);
} else {
  bootstrapSovereignChess();
}
