<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sovereign 3D — Royal Chess Suite</title>
  <style>
/* ============================================================================
   src/styles/main.css
   Obsidian & Gilded Sovereign — Dark Cinematic 3D Gaming HUD Architecture
   ============================================================================ */

:root {
  --bg-void: #07090e;
  --bg-obsidian: rgba(13, 17, 26, 0.82);
  --bg-panel: rgba(17, 22, 34, 0.88);
  --bg-elevated: rgba(26, 33, 49, 0.92);
  --border-subtle: rgba(255, 255, 255, 0.09);
  --border-gold: rgba(230, 186, 82, 0.38);
  --accent-gold: #e6ba52;
  --accent-gold-bright: #f7d377;
  --accent-cyan: #38bdf8;
  --accent-emerald: #10b981;
  --accent-crimson: #f43f5e;
  --accent-amber: #f59e0b;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --shadow-hud: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.07);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Cinzel', 'Playfair Display', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
}

body.high-contrast {
  --bg-obsidian: rgba(0, 0, 0, 0.96);
  --bg-panel: rgba(5, 5, 10, 0.98);
  --border-subtle: rgba(255, 255, 255, 0.38);
  --text-primary: #ffffff;
  --text-secondary: #e2e8f0;
  --accent-gold: #ffd700;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* Fullscreen 3D WebGL Stage */
#webgl-stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

#chess-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

body.bloom-enabled #chess-canvas {
  filter: contrast(1.04) saturate(1.08);
}

/* 3D Projected Board Coordinates & Analysis Overlays */
#board-overlay-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

.coord-marker {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(248, 250, 252, 0.78);
  background: rgba(7, 9, 14, 0.65);
  border: 1px solid rgba(230, 186, 82, 0.28);
  padding: 1px 5px;
  border-radius: 4px;
  text-shadow: 0 1px 2px #000;
}

.analysis-3d-badge {
  position: absolute;
  transform: translate(-50%, -100%);
  padding: 3px 8px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.25);
  white-space: nowrap;
}

/* Top Navigation Bar */
.top-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: linear-gradient(180deg, rgba(7, 9, 14, 0.92) 0%, rgba(7, 9, 14, 0.65) 100%);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  flex-shrink: 0;
}

.brand-crest {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(230, 186, 82, 0.25), rgba(230, 186, 82, 0.05));
  border: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-gold);
  font-size: 18px;
  flex-shrink: 0;
}

.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.12em;
  color: var(--text-primary);
  text-transform: uppercase;
  white-space: nowrap;
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent-gold);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-btn {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid transparent;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all 0.16s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.nav-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.06);
}

.nav-btn.active {
  color: var(--accent-gold-bright);
  background: rgba(230, 186, 82, 0.12);
  border-color: var(--border-gold);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  font-size: 14px;
}

.icon-btn:hover {
  border-color: var(--border-gold);
  color: var(--accent-gold);
  background: rgba(230, 186, 82, 0.1);
}

/* Home Overlay View */
.view-layer {
  position: fixed;
  top: 54px;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  pointer-events: none;
  display: flex;
}

.interactive-panel {
  pointer-events: auto;
  background: var(--bg-panel);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-hud);
}

.home-container {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 42px;
  gap: 32px;
}

.home-hero-card {
  max-width: 500px;
  width: 100%;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-height: calc(100vh - 96px);
  overflow-y: auto;
}

.eyebrow-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-gold);
  background: rgba(230, 186, 82, 0.12);
  border: 1px solid var(--border-gold);
  padding: 4px 10px;
  border-radius: 999px;
  width: fit-content;
}

.hero-headline {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: 0.03em;
  color: var(--text-primary);
}

.hero-subtitle {
  color: var(--text-secondary);
  font-size: 13.5px;
  line-height: 1.55;
}

/* Continue Game Recovery Banner */
.continue-banner {
  background: linear-gradient(135deg, rgba(230, 186, 82, 0.18), rgba(16, 185, 129, 0.10));
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.continue-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.continue-title {
  font-weight: 700;
  font-size: 13px;
  color: var(--accent-gold-bright);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.continue-meta {
  font-size: 12px;
  color: var(--text-secondary);
}

.continue-actions {
  display: flex;
  gap: 8px;
}

/* Action Grid on Home */
.home-actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mode-card {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mode-card:hover {
  background: rgba(230, 186, 82, 0.11);
  border-color: var(--border-gold);
  transform: translateY(-2px);
}

.mode-card.primary-mode {
  background: linear-gradient(135deg, rgba(230, 186, 82, 0.22), rgba(230, 186, 82, 0.06));
  border-color: var(--border-gold);
}

.mode-card-title {
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.04em;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mode-card-desc {
  font-size: 11.5px;
  color: var(--text-secondary);
}

/* 3-Column Game HUD Layout */
.game-hud-layout {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: space-between;
  padding: 14px 18px;
  gap: 16px;
}

.hud-left-col,
.hud-right-col {
  width: 296px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: calc(100vh - 82px);
}

.hud-center-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  padding: 4px 0;
}

/* Status Banner Floating Above Board */
.board-status-pill {
  pointer-events: auto;
  background: rgba(11, 15, 24, 0.88);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  padding: 8px 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-hud);
  font-weight: 600;
  font-size: 13px;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent-emerald);
  flex-shrink: 0;
}

.status-dot.thinking {
  background: var(--accent-cyan);
  box-shadow: 0 0 12px var(--accent-cyan);
  animation: pulseGlow 1s infinite alternate;
}

.status-dot.check {
  background: var(--accent-crimson);
  box-shadow: 0 0 14px var(--accent-crimson);
  animation: pulseGlow 0.55s infinite alternate;
}

@keyframes pulseGlow {
  from { transform: scale(0.9); opacity: 0.7; }
  to { transform: scale(1.25); opacity: 1; }
}

/* Player & Clock Cards */
.player-card {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: border-color 0.2s ease;
}

.player-card.active-turn {
  border-color: var(--border-gold);
  background: linear-gradient(90deg, rgba(230, 186, 82, 0.12), rgba(17, 22, 34, 0.9));
}

.player-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.player-name-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 13px;
  color: var(--text-primary);
}

.color-swatch-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.4);
  flex-shrink: 0;
}

.captured-tray {
  font-size: 12px;
  color: var(--text-secondary);
  min-height: 17px;
  letter-spacing: -1px;
}

.clock-box {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  min-width: 74px;
  text-align: center;
}

.clock-box.clock-active {
  color: var(--accent-gold-bright);
  border-color: var(--border-gold);
}

.clock-box.clock-low {
  color: var(--accent-crimson);
  border-color: var(--accent-crimson);
}

/* Evaluation Bar + Camera Presets Card */
.hud-section-card {
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.eval-bar-track {
  width: 100%;
  height: 10px;
  background: #1e2433;
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: flex;
}

.eval-bar-white {
  height: 100%;
  background: linear-gradient(90deg, #e2e8f0, #f8fafc);
  transition: width 0.35s ease;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

/* Buttons */
.btn {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  padding: 7px 11px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.25);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-gold {
  background: linear-gradient(135deg, #e6ba52, #c69328);
  color: #090c12;
  border-color: #f7d377;
  font-weight: 700;
}

.btn-gold:hover:not(:disabled) {
  background: linear-gradient(135deg, #f3ca66, #d4a134);
  color: #05070b;
}

.btn-danger {
  background: rgba(244, 63, 94, 0.14);
  color: #fda4af;
  border-color: rgba(244, 63, 94, 0.35);
}

.btn-danger:hover:not(:disabled) {
  background: rgba(244, 63, 94, 0.26);
}

.btn-sm {
  padding: 5px 8px;
  font-size: 11px;
}

.btn.active-preset {
  border-color: var(--border-gold);
  color: var(--accent-gold-bright);
  background: rgba(230, 186, 82, 0.15);
}

/* Move History List */
.move-history-card {
  flex: 1;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  padding: 12px 14px;
  overflow: hidden;
}

.move-list-scroll {
  flex: 1;
  overflow-y: auto;
  margin-top: 8px;
  padding-right: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
}

.move-pair-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr;
  align-items: center;
  padding: 3px 6px;
  border-radius: 4px;
}

.move-pair-row:nth-child(odd) {
  background: rgba(255, 255, 255, 0.025);
}

.move-num {
  color: var(--text-muted);
}

.move-san-btn {
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: left;
  padding: 3px 6px;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.move-san-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

.move-san-btn.current-move {
  background: rgba(230, 186, 82, 0.22);
  color: var(--accent-gold-bright);
  font-weight: 700;
}

/* Replay Bar */
.replay-controls-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
}

.replay-transport {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

/* Fullscreen Modal / Drawer Pages */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(4, 6, 11, 0.76);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-window {
  background: var(--bg-elevated);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-hud);
  width: 100%;
  max-width: 860px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--accent-gold-bright);
}

.modal-body {
  padding: 20px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.input-control,
.select-control,
.textarea-control {
  background: rgba(7, 9, 14, 0.75);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 8px 11px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 13px;
}

.textarea-control {
  font-family: var(--font-mono);
  font-size: 12px;
  min-height: 110px;
  resize: vertical;
  user-select: text;
  -webkit-user-select: text;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
}

.stats-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
}

.kpi-card {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.kpi-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 800;
  color: var(--accent-gold-bright);
}

.kpi-label {
  font-size: 11.5px;
  color: var(--text-secondary);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-card {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.badge {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}

.badge-win { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
.badge-loss { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }
.badge-draw { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }
.badge-active { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }

/* Toast Notification */
#toast-container {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast-item {
  background: rgba(13, 17, 26, 0.95);
  border: 1px solid var(--border-gold);
  color: var(--text-primary);
  padding: 10px 18px;
  border-radius: 999px;
  box-shadow: var(--shadow-hud);
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Fullscreen Zen Mode */

      if (piece.type === 'r' || piece.type === 'q') {
        dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);
      }
      for (const [dr, dc] of dirs) {
        let nr = r + dr;
        let nc = c + dc;
        while (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
          const target = this.board[nr][nc];
          if (!target) {
            moves.push({
              from: fromSq,
              to: coordsToSquare(nr, nc),
              fromRow: r,
              fromCol: c,
              toRow: nr,
              toCol: nc,
              piece: piece.type,
              color,
              flags: 'n',
            });
          } else {
            if (target.color === enemy) {
              moves.push({
                from: fromSq,
                to: coordsToSquare(nr, nc),
                fromRow: r,
                fromCol: c,
                toRow: nr,
                toCol: nc,
                piece: piece.type,
                color,
                captured: target.type,
                flags: 'c',
              });
            }
            break;
          }
          nr += dr;
          nc += dc;
        }
      }
    } else if (piece.type === 'k') {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
            const target = this.board[nr][nc];
            if (!target || target.color === enemy) {
              moves.push({
                from: fromSq,
                to: coordsToSquare(nr, nc),
                fromRow: r,
                fromCol: c,
                toRow: nr,
                toCol: nc,
                piece: piece.type,
                color,
                captured: target ? target.type : undefined,
                flags: target ? 'c' : 'n',
              });
            }
          }
        }
      }

      const homeRow = color === 'w' ? 7 : 0;
      if (r === homeRow && c === 4 && !this.isSquareAttacked(homeRow, 4, enemy)) {
        const canKS = color === 'w' ? this.castling.wK : this.castling.bK;
        const rookK = this.board[homeRow][7];
        if (
          canKS &&
          rookK &&
          rookK.color === color &&
          rookK.type === 'r' &&
          !this.board[homeRow][5] &&
          !this.board[homeRow][6] &&
          !this.isSquareAttacked(homeRow, 5, enemy) &&
          !this.isSquareAttacked(homeRow, 6, enemy)
        ) {
          moves.push({
            from: fromSq,
            to: coordsToSquare(homeRow, 6),
            fromRow: homeRow,
            fromCol: 4,
            toRow: homeRow,
            toCol: 6,
            piece: 'k',
            color,
            flags: 'k',
          });
        }
        const canQS = color === 'w' ? this.castling.wQ : this.castling.bQ;
        const rookQ = this.board[homeRow][0];
        if (
          canQS &&
          rookQ &&
          rookQ.color === color &&
          rookQ.type === 'r' &&
          !this.board[homeRow][1] &&
          !this.board[homeRow][2] &&
          !this.board[homeRow][3] &&
          !this.isSquareAttacked(homeRow, 3, enemy) &&
          !this.isSquareAttacked(homeRow, 2, enemy)
        ) {
          moves.push({
            from: fromSq,
            to: coordsToSquare(homeRow, 2),
            fromRow: homeRow,
            fromCol: 4,
            toRow: homeRow,
            toCol: 2,
            piece: 'k',
            color,
            flags: 'q',
          });
        }
      }
    }

    return moves;
  }

  _isPseudoMoveLegal(move) {
    const { fromRow, fromCol, toRow, toCol, color, flags, promotion } = move;
    const movingPiece = this.board[fromRow][fromCol];
    const targetPiece = this.board[toRow][toCol];
    let epCapturedPiece = null;
    const epCapRow = fromRow;
    const epCapCol = toCol;

    this.board[toRow][toCol] = promotion
      ? { ...movingPiece, type: promotion }
      : movingPiece;
    this.board[fromRow][fromCol] = null;

    if (flags === 'e') {
      epCapturedPiece = this.board[epCapRow][epCapCol];
      this.board[epCapRow][epCapCol] = null;
    }

    const inCheck = this.isKingInCheck(color);

    this.board[fromRow][fromCol] = movingPiece;
    this.board[toRow][toCol] = targetPiece;
    if (flags === 'e') {
      this.board[epCapRow][epCapCol] = epCapturedPiece;
    }

    return !inCheck;
  }

  getLegalMoves(square = null) {
    const rawMoves = [];
    if (square) {
      const coords = squareToCoords(square);
      if (!coords) return [];
      const pseudo = this._generatePseudoMovesForSquare(coords.row, coords.col, this.turn);
      for (const m of pseudo) {
        if (this._isPseudoMoveLegal(m)) rawMoves.push(m);
      }
    } else {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = this.board[r][c];
          if (p && p.color === this.turn) {
            const pseudo = this._generatePseudoMovesForSquare(r, c, this.turn);
            for (const m of pseudo) {
              if (this._isPseudoMoveLegal(m)) rawMoves.push(m);
            }
          }
        }
      }
    }

    const allLegal = square ? this._getAllRawLegalMoves() : rawMoves;
    return rawMoves.map((m) => ({
      ...m,
      san: this._computeSan(m, allLegal),
    }));
  }

  _getAllRawLegalMoves() {
    const all = [];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = this.board[r][c];
        if (p && p.color === this.turn) {
          const pseudo = this._generatePseudoMovesForSquare(r, c, this.turn);
          for (const m of pseudo) {
            if (this._isPseudoMoveLegal(m)) all.push(m);
          }
        }
      }
    }
    return all;
  }

  _computeSan(move, allLegalMoves) {
    let san = '';
    if (move.flags === 'k') {
      san = 'O-O';
    } else if (move.flags === 'q') {
      san = 'O-O-O';
    } else {
      if (move.piece !== 'p') {
        san += move.piece.toUpperCase();
        const ambiguous = allLegalMoves.filter(
          (other) =>
            other.piece === move.piece &&
            other.to === move.to &&
            other.from !== move.from &&
            (!other.promotion || other.promotion === move.promotion)
        );
        if (ambiguous.length > 0) {
          const sameFile = ambiguous.some((o) => o.from[0] === move.from[0]);
          const sameRank = ambiguous.some((o) => o.from[1] === move.from[1]);
          if (!sameFile) {
            san += move.from[0];
          } else if (!sameRank) {
            san += move.from[1];
          } else {
            san += move.from;
          }
        }
      }
      if (move.captured) {
        if (move.piece === 'p') san += move.from[0];
        san += 'x';
      }
      san += move.to;
      if (move.promotion) {
        san += '=' + move.promotion.toUpperCase();
      }
    }

    const enemy = move.color === 'w' ? 'b' : 'w';
    const { fromRow, fromCol, toRow, toCol, flags, promotion } = move;
    const movingPiece = this.board[fromRow][fromCol];
    const targetPiece = this.board[toRow][toCol];
    let epCapturedPiece = null;
    let rookPiece = null;

    this.board[toRow][toCol] = promotion ? { ...movingPiece, type: promotion } : movingPiece;
    this.board[fromRow][fromCol] = null;
    if (flags === 'e') {
      epCapturedPiece = this.board[fromRow][toCol];
      this.board[fromRow][toCol] = null;
    } else if (flags === 'k') {
      rookPiece = this.board[fromRow][7];
      this.board[fromRow][5] = rookPiece;
      this.board[fromRow][7] = null;
    } else if (flags === 'q') {
      rookPiece = this.board[fromRow][0];
      this.board[fromRow][3] = rookPiece;
      this.board[fromRow][0] = null;
    }

    const prevEp = this.epSquare;
    this.epSquare = flags === 'b' ? coordsToSquare((fromRow + toRow) / 2, fromCol) : null;

    const givesCheck = this.isKingInCheck(enemy);
    let hasEnemyReply = false;
    if (givesCheck) {
      outer: for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = this.board[r][c];
          if (p && p.color === enemy) {
            const replies = this._generatePseudoMovesForSquare(r, c, enemy);
            for (const rep of replies) {
              if (this._isPseudoMoveLegal(rep)) {
                hasEnemyReply = true;
                break outer;
              }
            }
          }
        }
      }
    }

    this.epSquare = prevEp;
    this.board[fromRow][fromCol] = movingPiece;
    this.board[toRow][toCol] = targetPiece;
    if (flags === 'e') {
      this.board[fromRow][toCol] = epCapturedPiece;
    } else if (flags === 'k') {
      this.board[fromRow][7] = rookPiece;
      this.board[fromRow][5] = null;
    } else if (flags === 'q') {
      this.board[fromRow][0] = rookPiece;
      this.board[fromRow][3] = null;
    }

    if (givesCheck) {
      san += hasEnemyReply ? '+' : '#';
    }
    return san;
  }

  move(moveOrSan) {
    const legalMoves = this.getLegalMoves();
    let chosen = null;

    if (typeof moveOrSan === 'string') {
      const clean = moveOrSan.trim().replace(/[+#?!]+$/g, '').replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');
      chosen = legalMoves.find(
        (m) =>
          m.san === moveOrSan.trim() ||
          m.san.replace(/[+#]+$/g, '') === clean ||
          `${m.from}${m.to}${m.promotion || ''}` === clean.toLowerCase()
      );
    } else if (moveOrSan && typeof moveOrSan === 'object') {
      const promo = moveOrSan.promotion ? moveOrSan.promotion.toLowerCase() : undefined;
      chosen = legalMoves.find(
        (m) =>
          m.from === moveOrSan.from &&
          m.to === moveOrSan.to &&
          (!m.promotion || m.promotion === (promo || 'q'))
      );
    }

    if (!chosen) return null;

    const snapshot = {
      board: this.board.map((row) => row.map((cell) => (cell ? { ...cell } : null))),
      turn: this.turn,
      castling: { ...this.castling },
      epSquare: this.epSquare,
      halfMoveClock: this.halfMoveClock,
      fullMoveNumber: this.fullMoveNumber,
      fenBefore: this.fen(),
    };

    const { fromRow, fromCol, toRow, toCol, flags, promotion, color } = chosen;
    const movingPiece = this.board[fromRow][fromCol];
    let capturedPieceObj = this.board[toRow][toCol];

    this.board[toRow][toCol] = promotion
      ? { ...movingPiece, type: promotion }
      : { ...movingPiece };
    this.board[fromRow][fromCol] = null;

    if (flags === 'e') {
      capturedPieceObj = this.board[fromRow][toCol];
      this.board[fromRow][toCol] = null;
    } else if (flags === 'k') {
      const rook = this.board[fromRow][7];
      this.board[fromRow][5] = rook;
      this.board[fromRow][7] = null;
    } else if (flags === 'q') {
      const rook = this.board[fromRow][0];
      this.board[fromRow][3] = rook;
      this.board[fromRow][0] = null;
    }

    if (movingPiece.type === 'k') {
      if (color === 'w') {
        this.castling.wK = false;
        this.castling.wQ = false;
      } else {
        this.castling.bK = false;
        this.castling.bQ = false;
      }
    }
    if (fromRow === 7 && fromCol === 0) this.castling.wQ = false;
    if (fromRow === 7 && fromCol === 7) this.castling.wK = false;
    if (fromRow === 0 && fromCol === 0) this.castling.bQ = false;
    if (fromRow === 0 && fromCol === 7) this.castling.bK = false;
    if (toRow === 7 && toCol === 0) this.castling.wQ = false;
    if (toRow === 7 && toCol === 7) this.castling.wK = false;
    if (toRow === 0 && toCol === 0) this.castling.bQ = false;
    if (toRow === 0 && toCol === 7) this.castling.bK = false;

    if (flags === 'b') {
      this.epSquare = coordsToSquare((fromRow + toRow) / 2, fromCol);
    } else {
      this.epSquare = null;
    }

    if (movingPiece.type === 'p' || chosen.captured) {
      this.halfMoveClock = 0;
    } else {
      this.halfMoveClock++;
    }
    if (color === 'b') {
      this.fullMoveNumber++;
    }
    this.turn = color === 'w' ? 'b' : 'w';

    this._recordPosition();

    const moveRecord = {
      ...chosen,
      pieceId: movingPiece.id,
      capturedPieceId: capturedPieceObj ? capturedPieceObj.id : null,
      fenBefore: snapshot.fenBefore,
      fenAfter: this.fen(),
      moveNumber: snapshot.fullMoveNumber,
      timestamp: Date.now(),
      _snapshot: snapshot,
    };
    this.history.push(moveRecord);
    return moveRecord;
  }

  undo() {
    if (this.history.length === 0) return null;
    this._unrecordPosition();
    const last = this.history.pop();
    const snap = last._snapshot;
    this.board = snap.board;
    this.turn = snap.turn;
    this.castling = snap.castling;
    this.epSquare = snap.epSquare;
    this.halfMoveClock = snap.halfMoveClock;
    this.fullMoveNumber = snap.fullMoveNumber;
    return last;
  }

  isCheckmate() {
    return this.inCheck() && this._getAllRawLegalMoves().length === 0;
  }

  isStalemate() {
    return !this.inCheck() && this._getAllRawLegalMoves().length === 0;
  }

  isThreefoldRepetition() {
    const key = this.getPositionKey();
    return (this.positionCounts.get(key) || 0) >= 3;
  }

  isFiftyMoveRule() {
    return this.halfMoveClock >= 100;
  }

  isInsufficientMaterial() {
    const pieces = this.getBoardPieces();
    if (pieces.length === 2) return true;
    if (pieces.length === 3) {
      const minor = pieces.find((p) => p.type === 'n' || p.type === 'b');
      if (minor) return true;
    }
    if (pieces.length === 4) {
      const bishops = pieces.filter((p) => p.type === 'b');
      if (bishops.length === 2 && bishops[0].color !== bishops[1].color) {
        const sqColor0 = (bishops[0].row + bishops[0].col) % 2;
        const sqColor1 = (bishops[1].row + bishops[1].col) % 2;
        if (sqColor0 === sqColor1) return true;
      }
    }
    return false;
  }

  isDraw() {
    return (
      this.isStalemate() ||
      this.isThreefoldRepetition() ||
      this.isFiftyMoveRule() ||
      this.isInsufficientMaterial()
    );
  }

  isGameOver() {
    return this.isCheckmate() || this.isDraw();
  }

  getGameStatus() {
    if (this.isCheckmate()) {
      const winner = this.turn === 'w' ? 'b' : 'w';
      return {
        over: true,
        status: 'CHECKMATE',
        winner,
        result: winner === 'w' ? '1-0' : '0-1',
        reason: 'Checkmate',
      };
    }
    if (this.isStalemate()) {
      return { over: true, status: 'DRAW', winner: 'draw', result: '1/2-1/2', reason: 'Stalemate' };
    }
    if (this.isThreefoldRepetition()) {
      return { over: true, status: 'DRAW', winner: 'draw', result: '1/2-1/2', reason: 'Threefold Repetition' };
    }
    if (this.isFiftyMoveRule()) {
      return { over: true, status: 'DRAW', winner: 'draw', result: '1/2-1/2', reason: 'Fifty-Move Rule' };
    }
    if (this.isInsufficientMaterial()) {
      return { over: true, status: 'DRAW', winner: 'draw', result: '1/2-1/2', reason: 'Insufficient Material' };
    }
    return {
      over: false,
      status: this.inCheck() ? 'CHECK' : 'ACTIVE',
      winner: null,
      result: '*',
      reason: this.inCheck() ? 'Check' : '',
    };
  }

  pgn(customHeaders = {}) {
    const merged = { ...this.headers, ...customHeaders };
    if (this.startingFen !== STANDARD_START_FEN) {
      merged.SetUp = '1';
      merged.FEN = this.startingFen;
    }
    const status = this.getGameStatus();
    if (status.over && (!merged.Result || merged.Result === '*')) {
      merged.Result = status.result;
    }

    let headerBlock = '';
    for (const [k, v] of Object.entries(merged)) {
      headerBlock += `[${k} "${String(v).replace(/"/g, '\\"')}"]\n`;
    }

    let moveText = '';
    for (let i = 0; i < this.history.length; i++) {
      const m = this.history[i];
      if (m.color === 'w') {
        moveText += `${m.moveNumber}. ${m.san} `;
      } else {
        if (i === 0) {
          moveText += `${m.moveNumber}... ${m.san} `;
        } else {
          moveText += `${m.san} `;
        }
      }
    }
    const finalResult = merged.Result || '*';
    moveText = (moveText + finalResult).trim();
    return `${headerBlock}\n${moveText}`;
  }

  loadPgn(pgnString) {
    if (!pgnString || typeof pgnString !== 'string') {
      return { valid: false, error: 'PGN string must not be empty.' };
    }
    const headers = {};
    const headerRegex = /\[([A-Za-z0-9_]+)\s+"([^"]*)"\]/g;
    let match;
    while ((match = headerRegex.exec(pgnString)) !== null) {
      headers[match[1]] = match[2];
    }

    const startFen = headers.FEN || STANDARD_START_FEN;
    const fenValidation = validateFen(startFen);
    if (!fenValidation.valid) {
      return { valid: false, error: `Invalid FEN in PGN header: ${fenValidation.error}` };
    }

    let body = pgnString
      .replace(/\[[A-Za-z0-9_]+\s+"[^"]*"\]/g, ' ')
      .replace(/\{[^}]*\}/g, ' ')
      .replace(/;[^\n]*/g, ' ');
    while (/\([^()]*\)/.test(body)) {
      body = body.replace(/\([^()]*\)/g, ' ');
    }
    body = body.replace(/\$\d+/g, ' ');

    const tokens = body
      .trim()
      .split(/\s+/)
      .filter((t) => t && !/^\d+\.+$/.test(t) && !['1-0', '0-1', '1/2-1/2', '*'].includes(t));

    const tempEngine = new ChessEngine(startFen);
    for (let token of tokens) {
      token = token.replace(/^\d+\.+/, '');
      if (!token) continue;
      const mv = tempEngine.move(token);
      if (!mv) {
        return { valid: false, error: `Illegal or unrecognized PGN move token: "${token}"` };
      }
    }

    this.reset(startFen);
    this.headers = { ...this.headers, ...headers };
    for (let token of tokens) {
      token = token.replace(/^\d+\.+/, '');
      if (!token) continue;
      this.move(token);
    }
    return { valid: true, error: null, moveCount: this.history.length };
  }
}

// ============================================================================
// src/storage/index.js
// Clean StorageService Abstraction (GameStorage via IndexedDB + localStorage
// mirror, SettingsStorage, ProfileStorage, AchievementStorage, PuzzleStorage)
// ============================================================================

const DB_NAME = 'Sovereign3DChessDB';
const DB_VERSION = 2;
const GAMES_STORE = 'games';

const LS_KEYS = {
  GAMES_FALLBACK: 'sovereign_chess_games_v2',
  ACTIVE_GAME_ID: 'sovereign_chess_active_game_id_v2',
  SETTINGS: 'sovereign_chess_settings_v2',
  PROFILE: 'sovereign_chess_profile_v2',
  ACHIEVEMENTS: 'sovereign_chess_achievements_v2',
  PUZZLES: 'sovereign_chess_puzzles_v2',
  SCHEMA_VERSION: 'sovereign_chess_schema_v2',
};

const memoryStore =
  (typeof window !== 'undefined' &&
    (window.__sovereignMemoryStore = window.__sovereignMemoryStore || {})) ||
  {};

function safeJsonParse(raw, fallback) {
  if (!raw || typeof raw !== 'string') return fallback;
  try {
    const parsed = JSON.parse(raw);
    return parsed !== null && parsed !== undefined ? parsed : fallback;
  } catch (err) {
    console.warn('[StorageService] Corrupted JSON detected, recovering with default:', err);
    return fallback;
  }
}

function safeLocalStorageGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    if (raw !== null && raw !== undefined) {
      return safeJsonParse(raw, fallback);
    }
  } catch (err) {
    // Fallback to in-memory store if localStorage is restricted
  }
  if (memoryStore[key] !== undefined) {
    return safeJsonParse(memoryStore[key], fallback);
  }
  return fallback;
}

function safeLocalStorageSet(key, value) {
  const serialized = JSON.stringify(value);
  memoryStore[key] = serialized;
  try {
    window.localStorage.setItem(key, serialized);
    return true;
  } catch (err) {
    return true;
  }
}

function detectOptimalQualityPreset() {
  try {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    const cores = navigator.hardwareConcurrency || 4;
    const memory = navigator.deviceMemory || 4;
    if (isMobile && (cores <= 4 || memory <= 3)) return 'MEDIUM';
    if (isMobile) return 'HIGH';
    if (cores >= 8 && memory >= 8) return 'ULTRA';
    return 'HIGH';
  } catch {
    return 'HIGH';
  }
}

class IndexedDBAdapter {
  constructor() {
    this.dbPromise = null;
  }

  open() {
    if (this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve) => {
      if (
        typeof window === 'undefined' ||
        !window.indexedDB ||
        (window.location && window.location.protocol === 'about:')
      ) {
        resolve(null);
        return;
      }
      let settled = false;
      const finish = (val) => {
        if (!settled) {
          settled = true;
          resolve(val);
        }
      };
      const timer = setTimeout(() => finish(null), 350);
      try {
        const req = window.indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(GAMES_STORE)) {
            const store = db.createObjectStore(GAMES_STORE, { keyPath: 'id' });
            store.createIndex('updatedAt', 'updatedAt', { unique: false });
            store.createIndex('status', 'status', { unique: false });
          }
        };
        req.onsuccess = (e) => {
          clearTimeout(timer);
          finish(e.target.result);
        };
        req.onerror = () => {
          clearTimeout(timer);
          finish(null);
        };
        req.onblocked = () => {
          clearTimeout(timer);
          finish(null);
        };
      } catch {
        clearTimeout(timer);
        finish(null);
      }
    });
    return this.dbPromise;
  }

  async putGame(record) {
    const db = await this.open();
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([GAMES_STORE], 'readwrite');
        const store = tx.objectStore(GAMES_STORE);
        store.put(record);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  async getAllGames() {
    const db = await this.open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([GAMES_STORE], 'readonly');
        const store = tx.objectStore(GAMES_STORE);
        const req = store.getAll();
        req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : null);
        req.onerror = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  async deleteGame(id) {
    const db = await this.open();
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([GAMES_STORE], 'readwrite');
        tx.objectStore(GAMES_STORE).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  async clearAll() {
    const db = await this.open();
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([GAMES_STORE], 'readwrite');
        tx.objectStore(GAMES_STORE).clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }
}

const idb = new IndexedDBAdapter();

// ----------------------------------------------------------------------------
// 1. GameStorage Service
// ----------------------------------------------------------------------------
const GameStorage = {
  _cache: null,

  _validateRecord(rec) {
    if (!rec || typeof rec !== 'object' || !rec.id) return null;
    return createGameRecord(rec);
  },

  _loadCacheSync() {
    if (this._cache) return this._cache;
    const rawList = safeLocalStorageGet(LS_KEYS.GAMES_FALLBACK, []);
    const valid = Array.isArray(rawList)
      ? rawList.map((r) => this._validateRecord(r)).filter(Boolean)
      : [];
    this._cache = valid;
    return this._cache;
  },

  async init() {
    const syncList = this._loadCacheSync();
    const idbList = await idb.getAllGames();
    if (Array.isArray(idbList) && idbList.length > 0) {
      const mergedMap = new Map();
      for (const item of syncList) mergedMap.set(item.id, item);
      for (const item of idbList) {
        const valid = this._validateRecord(item);
        if (valid) {
          const existing = mergedMap.get(valid.id);
          if (!existing || new Date(valid.updatedAt) >= new Date(existing.updatedAt)) {
            mergedMap.set(valid.id, valid);
          }
        }
      }
      this._cache = Array.from(mergedMap.values()).sort(
        (a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)
      );
      safeLocalStorageSet(LS_KEYS.GAMES_FALLBACK, this._cache.slice(0, 200));
    } else if (syncList.length > 0) {
      for (const g of syncList) {
        await idb.putGame(g);
      }
    }
    return this._cache;
  },

  getAllSync() {
    return [...this._loadCacheSync()].sort(
      (a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)
    );
  },

  getById(id) {
    if (!id) return null;
    return this._loadCacheSync().find((g) => g.id === id) || null;
  },

  getNextGameNumber() {
    const list = this._loadCacheSync();
    const maxNum = list.reduce((max, g) => Math.max(max, g.gameNumber || 0), 0);
    return maxNum + 1;
  },

  saveGame(record) {
    const valid = this._validateRecord({
      ...record,
      updatedAt: new Date().toISOString(),
    });
    if (!valid) return null;
    const list = this._loadCacheSync();
    const idx = list.findIndex((g) => g.id === valid.id);
    if (idx >= 0) {
      list[idx] = valid;
    } else {
      if (!record.gameNumber) valid.gameNumber = this.getNextGameNumber();
      list.unshift(valid);
    }
    this._cache = list;
    safeLocalStorageSet(LS_KEYS.GAMES_FALLBACK, list.slice(0, 200));
    idb.putGame(valid);

    if (valid.status === 'in_progress') {
      safeLocalStorageSet(LS_KEYS.ACTIVE_GAME_ID, valid.id);
    } else {
      const currentActive = safeLocalStorageGet(LS_KEYS.ACTIVE_GAME_ID, null);
      if (currentActive === valid.id) {
        safeLocalStorageSet(LS_KEYS.ACTIVE_GAME_ID, null);
      }
    }
    return valid;
  },

  getInterruptedGame() {
    const activeId = safeLocalStorageGet(LS_KEYS.ACTIVE_GAME_ID, null);
    if (activeId) {
      const found = this.getById(activeId);
      if (found && found.status === 'in_progress' && found.moves && found.moves.length > 0) {
        return found;
      }
    }
    const recentInProgress = this.getAllSync().find(
      (g) => g.status === 'in_progress' && Array.isArray(g.moves) && g.moves.length > 0
    );
    return recentInProgress || null;
  },

  clearActiveGamePointer() {
    safeLocalStorageSet(LS_KEYS.ACTIVE_GAME_ID, null);
  },

  deleteGame(id) {
    const list = this._loadCacheSync().filter((g) => g.id !== id);
    this._cache = list;
    safeLocalStorageSet(LS_KEYS.GAMES_FALLBACK, list);
    const activeId = safeLocalStorageGet(LS_KEYS.ACTIVE_GAME_ID, null);
    if (activeId === id) {
      safeLocalStorageSet(LS_KEYS.ACTIVE_GAME_ID, null);
    }
    idb.deleteGame(id);
    return true;
  },

  clearAllGames() {
    this._cache = [];
    safeLocalStorageSet(LS_KEYS.GAMES_FALLBACK, []);
    safeLocalStorageSet(LS_KEYS.ACTIVE_GAME_ID, null);
    idb.clearAll();
  },
};

const SettingsStorage = {
  _settings: null,

  load() {
    if (this._settings) return this._settings;
    const saved = safeLocalStorageGet(LS_KEYS.SETTINGS, null);
    const optimalQuality = detectOptimalQualityPreset();
    const merged = {
      version: DefaultSettings.version,
      gameplay: { ...DefaultSettings.gameplay, ...(saved?.gameplay || {}) },
      board: { ...DefaultSettings.board, ...(saved?.board || {}) },
      camera: { ...DefaultSettings.camera, ...(saved?.camera || {}) },
      graphics: {
        ...DefaultSettings.graphics,
        quality: optimalQuality,
        ...(saved?.graphics || {}),
      },
      audio: { ...DefaultSettings.audio, ...(saved?.audio || {}) },
      accessibility: { ...DefaultSettings.accessibility, ...(saved?.accessibility || {}) },
    };
    this._settings = merged;
    return merged;
  },

  save(newSettings) {
    this._settings = {
      ...this.load(),
      ...newSettings,
    };
    safeLocalStorageSet(LS_KEYS.SETTINGS, this._settings);
    return this._settings;
  },

  updateCategory(category, partial) {
    const cur = this.load();
    const updated = {
      ...cur,
      [category]: {
        ...(cur[category] || {}),
        ...partial,
      },
    };
    return this.save(updated);
  },

  applyQualityPreset(quality) {
    const presets = {
      LOW: {
        quality: 'LOW',
        shadows: false,
        reflections: false,
        bloom: false,
        particles: false,
        antiAliasing: false,
        environmentEffects: false,
      },
      MEDIUM: {
        quality: 'MEDIUM',
        shadows: true,
        reflections: false,
        bloom: false,
        particles: true,
        antiAliasing: true,
        environmentEffects: true,
      },
      HIGH: {
        quality: 'HIGH',
        shadows: true,
        reflections: true,
        bloom: true,
        particles: true,
        antiAliasing: true,
        environmentEffects: true,
      },
      ULTRA: {
        quality: 'ULTRA',
        shadows: true,
        reflections: true,
        bloom: true,
        particles: true,
        antiAliasing: true,
        environmentEffects: true,
      },
    };
    const preset = presets[quality] || presets.HIGH;
    return this.updateCategory('graphics', preset);
  },

  reset() {
    this._settings = JSON.parse(JSON.stringify(DefaultSettings));
    safeLocalStorageSet(LS_KEYS.SETTINGS, this._settings);
    return this._settings;
  },
};

// ----------------------------------------------------------------------------
const ProfileStorage = {
  load() {
    const fallback = {
      username: 'Grandmaster',
      avatar: 'crown',
      title: 'Sovereign Tactician',
      favoriteBoard: 'ROYAL',
      favoritePieceSet: 'Classic',
      createdAt: new Date().toISOString(),
    };
    const saved = safeLocalStorageGet(LS_KEYS.PROFILE, fallback);
    return { ...fallback, ...(saved || {}) };
  },

  save(partial) {
    const updated = { ...this.load(), ...partial };
    safeLocalStorageSet(LS_KEYS.PROFILE, updated);
    return updated;
  },

  getComputedStats() {
    const games = GameStorage.getAllSync();
    const completed = games.filter((g) => g.status === 'completed');
    let wins = 0;
    let losses = 0;
    let draws = 0;
    let totalMoves = 0;
    let totalDuration = 0;
    let longestGameMoves = 0;
    let longestGameDuration = 0;
    let currentStreak = 0;
    let bestStreak = 0;

    const byDifficulty = {
      Beginner: { played: 0, wins: 0, losses: 0, draws: 0 },
      Easy: { played: 0, wins: 0, losses: 0, draws: 0 },
      Medium: { played: 0, wins: 0, losses: 0, draws: 0 },
      Hard: { played: 0, wins: 0, losses: 0, draws: 0 },
      Expert: { played: 0, wins: 0, losses: 0, draws: 0 },
    };

    const chronological = [...completed].sort(
      (a, b) => new Date(a.createdAt) - new Date(b.createdAt)
    );

    for (const g of chronological) {
      const mCount = g.moveCount || (g.moves ? g.moves.length : 0);
      const dur = g.duration || 0;
      totalMoves += mCount;
      totalDuration += dur;
      if (mCount > longestGameMoves) longestGameMoves = mCount;
      if (dur > longestGameDuration) longestGameDuration = dur;

      const playerSide = g.playerColor || 'w';
      const isDraw = g.winner === 'draw' || g.result === '1/2-1/2';

      if (isDraw) {
        draws++;
        currentStreak = 0;
      } else if (g.mode === 'ai') {
        if (g.winner === playerSide) {
          wins++;
          currentStreak++;
          if (currentStreak > bestStreak) bestStreak = currentStreak;
        } else {
          losses++;
          currentStreak = 0;
        }
      } else {
        if (g.winner === 'w') {
          wins++;
          currentStreak++;
          if (currentStreak > bestStreak) bestStreak = currentStreak;
        } else if (g.winner === 'b') {
          losses++;
          currentStreak = 0;
        }
      }

      if (g.mode === 'ai' && g.aiDifficulty && byDifficulty[g.aiDifficulty]) {
        byDifficulty[g.aiDifficulty].played++;
        if (isDraw) byDifficulty[g.aiDifficulty].draws++;
        else if (g.winner === playerSide) byDifficulty[g.aiDifficulty].wins++;
        else byDifficulty[g.aiDifficulty].losses++;
      }
    }

    const totalGames = completed.length;
    const winPercentage = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;
    const avgDuration = totalGames > 0 ? Math.round(totalDuration / totalGames) : 0;

    return {
      totalGames,
      allSavedCount: games.length,
      wins,
      losses,
      draws,
      winPercentage,
      totalMoves,
      avgDuration,
      longestGameMoves,
      longestGameDuration,
      currentStreak,
      bestStreak,
      byDifficulty,
    };
  },
};

    title: 'Endurance Grandmaster',
    description: 'Play a match lasting 60 or more half-moves (30+ full moves).',
    icon: 'clock',
  },
  {
    id: 'comeback',
    title: 'Royal Comeback',
    description: 'Win a match after being in check at least twice.',
    icon: 'shield',
  },
  {
    id: 'perfect_opening',
    title: 'Perfect Opening',
    description: 'Castle your King within the first 10 moves of a match.',
    icon: 'castle',
  },
];
const AchievementStorage = {
  loadUnlocked() {
    return safeLocalStorageGet(LS_KEYS.ACHIEVEMENTS, {});
  },

  getAllWithStatus() {
    const unlocked = this.loadUnlocked();
    return ACHIEVEMENT_DEFINITIONS.map((def) => ({
      ...def,
      unlocked: Boolean(unlocked[def.id]),
      unlockedAt: unlocked[def.id]?.unlockedAt || null,
    }));
  },

  unlock(id) {
    const unlocked = this.loadUnlocked();
    if (unlocked[id]) return null;
    const def = ACHIEVEMENT_DEFINITIONS.find((d) => d.id === id);
    if (!def) return null;
    unlocked[id] = { unlockedAt: new Date().toISOString() };
    safeLocalStorageSet(LS_KEYS.ACHIEVEMENTS, unlocked);
    return def;
  },

  evaluateAfterMoveOrGame({ move, gameRecord, stats, puzzlesSolvedCount = 0 }) {
    const newlyUnlocked = [];
    const tryUnlock = (id) => {
      const res = this.unlock(id);
      if (res) newlyUnlocked.push(res);
    };

    if (move) {
      if (move.captured === 'q') {
        tryUnlock('queen_slayer');
      }
      if ((move.flags === 'k' || move.flags === 'q') && move.moveNumber <= 10) {
        tryUnlock('perfect_opening');
      }
    }

    if (gameRecord && gameRecord.moves && gameRecord.moves.length >= 60) {
      tryUnlock('long_game');
    }

    if (gameRecord && gameRecord.status === 'completed') {
      const playerSide = gameRecord.playerColor || 'w';
      const playerWon =
        gameRecord.winner === playerSide ||
        (gameRecord.mode === 'local' && (gameRecord.winner === 'w' || gameRecord.winner === 'b'));

      if (playerWon) {
        tryUnlock('first_victory');
        if (gameRecord.terminationReason === 'Checkmate') {
          tryUnlock('first_checkmate');
        }
        const winnerColor = gameRecord.winner;
        const enemyColor = winnerColor === 'w' ? 'b' : 'w';
        const checksEndured = (gameRecord.moves || []).filter(
          (m) => m.color === enemyColor && m.san && m.san.includes('+')
        ).length;
        if (checksEndured >= 2) {
          tryUnlock('comeback');
        }
      }
    }

    if (stats) {
      if (stats.totalGames >= 10) tryUnlock('ten_games');
      if (stats.wins >= 10) tryUnlock('ten_wins');
      if (stats.bestStreak >= 5) tryUnlock('five_streak');
    }

    if (puzzlesSolvedCount >= 3) {
      tryUnlock('tactical_player');
    }

    return newlyUnlocked;
  },
};

// ----------------------------------------------------------------------------
// 5. PuzzleStorage Service
// ----------------------------------------------------------------------------
const PuzzleStorage = {
  load() {
    const fallback = {
      solvedIds: [],
      attemptsById: {},
      streak: 0,
      bestStreak: 0,
      rating: 1200,
    };
    return { ...fallback, ...safeLocalStorageGet(LS_KEYS.PUZZLES, fallback) };
  },

  recordAttempt(puzzleId, solved) {
    const data = this.load();
    data.attemptsById[puzzleId] = (data.attemptsById[puzzleId] || 0) + 1;
    if (solved) {
      if (!data.solvedIds.includes(puzzleId)) {
        data.solvedIds.push(puzzleId);
        data.rating += 18;
      }
      data.streak += 1;
      if (data.streak > data.bestStreak) data.bestStreak = data.streak;
    } else {
      data.streak = 0;
      data.rating = Math.max(800, data.rating - 8);
    }
    safeLocalStorageSet(LS_KEYS.PUZZLES, data);
    return data;
  },
};

// src/sounds/index.js
// Centralized Web Audio API Synthesizer (Move, Capture, Check, Checkmate,
// Castle, Promotion, Button Click, Victory, Defeat, Ambient Music)
// ============================================================================

class SoundManager {
  constructor() {
    this.ctx = null;
    this.musicNodes = null;
    this.isMusicPlaying = false;
  }

  _ensureContext() {
    if (typeof window === 'undefined') return null;
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      try {
        this.ctx = new AudioCtx();
      } catch {
        return null;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  _getEffectiveVolume(categoryKey = null) {
    const audio = SettingsStorage.load().audio;
    if (audio.muted) return 0;
    if (categoryKey && audio[categoryKey] === false) return 0;
    return Math.max(0, Math.min(1, audio.masterVolume ?? 0.8));
  }

  playMove() {
    const vol = this._getEffectiveVolume('moveSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    // Warm wooden thud + crisp felt transient
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(165, now);
    osc.frequency.exponentialRampToValueAtTime(58, now + 0.085);

    gain.gain.setValueAtTime(0.38 * vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  playCapture() {
    const vol = this._getEffectiveVolume('captureSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    // Percussive impact + dual resonant harmonic
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(240, now);
    osc1.frequency.exponentialRampToValueAtTime(48, now + 0.13);

    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(380, now);
    osc2.frequency.exponentialRampToValueAtTime(90, now + 0.11);

    gain.gain.setValueAtTime(0.45 * vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.145);
    osc2.stop(now + 0.145);
  }

  playCastle() {
    const vol = this._getEffectiveVolume('moveSound');
    if (vol <= 0) return;
    this.playMove();
    setTimeout(() => this.playMove(), 95);
  }

  playCheck() {
    const vol = this._getEffectiveVolume('checkSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    // Urgent crystalline warning interval (E5 -> Bb5 tritone/fifth chime)
    const freqs = [587.33, 880.0];
    freqs.forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + idx * 0.055);
      gain.gain.setValueAtTime(0.32 * vol, now + idx * 0.055);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.36);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + idx * 0.055);
      osc.stop(now + idx * 0.055 + 0.38);
    });
  }

  playPromotion() {
    const vol = this._getEffectiveVolume('moveSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.055);
      gain.gain.setValueAtTime(0.28 * vol, now + i * 0.055);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.055);
      osc.stop(now + i * 0.055 + 0.3);
    });
  }

  playCheckmate() {
    this.playVictory();
  }

  playVictory() {
    const vol = this._getEffectiveVolume('checkSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    // Royal fanfare chord arpeggio (D major 9th)
    const notes = [293.66, 369.99, 440.0, 587.33, 739.99];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0.30 * vol, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.75);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.78);
    });
  }

  playDefeat() {
    const vol = this._getEffectiveVolume('checkSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    const notes = [329.63, 293.66, 261.63, 220.0];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.11);
      gain.gain.setValueAtTime(0.28 * vol, now + i * 0.11);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.55);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.11);
      osc.stop(now + i * 0.11 + 0.58);
    });
  }

  playClick() {
    const vol = this._getEffectiveVolume('uiSound');
    if (vol <= 0) return;
    const ctx = this._ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(720, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.025);
    gain.gain.setValueAtTime(0.14 * vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.032);
  }

  syncMusicState() {
    const audio = SettingsStorage.load().audio;
    const shouldPlay = Boolean(audio.music && !audio.muted && audio.masterVolume > 0);
    if (shouldPlay && !this.isMusicPlaying) {
      this._startAmbientMusic();
    } else if (!shouldPlay && this.isMusicPlaying) {
      this._stopAmbientMusic();
    } else if (shouldPlay && this.musicNodes) {
      const vol = (audio.masterVolume ?? 0.8) * (audio.musicVolume ?? 0.3) * 0.12;
      this.musicNodes.masterGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.2);
    }
  }

  _startAmbientMusic() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    this._stopAmbientMusic();
    try {
      const audio = SettingsStorage.load().audio;
      const masterGain = ctx.createGain();
      const vol = (audio.masterVolume ?? 0.8) * (audio.musicVolume ?? 0.3) * 0.12;
      masterGain.gain.setValueAtTime(vol, ctx.currentTime);
      masterGain.connect(ctx.destination);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(110.0, ctx.currentTime); // A2 warm drone
      osc2.frequency.setValueAtTime(164.81, ctx.currentTime); // E3 fifth

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(360, ctx.currentTime);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(masterGain);

      osc1.start();
      osc2.start();
      this.musicNodes = { osc1, osc2, masterGain };
      this.isMusicPlaying = true;
    } catch {
      this.isMusicPlaying = false;
    }
  }

  _stopAmbientMusic() {
    if (this.musicNodes) {
      try {
        this.musicNodes.osc1.stop();
        this.musicNodes.osc2.stop();
        this.musicNodes.masterGain.disconnect();
      } catch {}
      this.musicNodes = null;
    }
    this.isMusicPlaying = false;
  }
}
const SoundSystem = new SoundManager();

// Evaluate board from White's perspective in centipawns
function evaluatePositionWhiteCp(engine) {
  if (engine.isCheckmate()) {
    return engine.turn === 'w' ? -99999 : 99999;
  }
  if (engine.isDraw()) {
    return 0;
  }

  let score = 0;
  let whiteBishops = 0;
  let blackBishops = 0;

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = engine.board[r][c];
      if (!p) continue;
      const base = PIECE_VALUES[p.type] || 0;
      const pstRow = p.color === 'w' ? r : 7 - r;
      const positional = PST[p.type] ? PST[p.type][pstRow][c] : 0;
      if (p.color === 'w') {
        score += base + positional;
        if (p.type === 'b') whiteBishops++;
      } else {
        score -= base + positional;
        if (p.type === 'b') blackBishops++;
      }
    }
  }

  // Bishop pair bonus
  if (whiteBishops >= 2) score += 35;
  if (blackBishops >= 2) score -= 35;

  // Check tempo bonus
  if (engine.inCheck()) {
    score += engine.turn === 'w' ? -25 : 25;
  }

  return score;
}

function scoreMoveOrdering(move) {
  let score = 0;
  if (move.captured) {
    score += 10 * (PIECE_VALUES[move.captured] || 100) - (PIECE_VALUES[move.piece] || 100) / 10;
  }
  if (move.promotion) {
    score += PIECE_VALUES[move.promotion] || 900;
  }
  if (move.flags === 'k' || move.flags === 'q') {
    score += 60;
  }
  return score;
}
function searchBestMove(fen, difficulty = 'Medium') {
  const engine = new ChessEngine(fen);
  const legalMoves = engine.getLegalMoves();
  if (legalMoves.length === 0) {
    return { bestMove: null, evalCp: evaluatePositionWhiteCp(engine), depth: 0 };
  }

  // Difficulty configuration (Depth + Quiescence + Positional fidelity)
  const diffConfig = {
    Beginner: { depth: 1, useBook: false, useQuiescence: false, topKWindow: 3, maxBlunderCp: 140 },
    Easy: { depth: 2, useBook: false, useQuiescence: false, topKWindow: 2, maxBlunderCp: 65 },
    Medium: { depth: 2, useBook: true, useQuiescence: true, topKWindow: 1, maxBlunderCp: 0 },
    Hard: { depth: 3, useBook: true, useQuiescence: true, topKWindow: 1, maxBlunderCp: 0 },
    Expert: { depth: 4, useBook: true, useQuiescence: true, topKWindow: 1, maxBlunderCp: 0 },
  }[difficulty] || { depth: 3, useBook: true, useQuiescence: true, topKWindow: 1, maxBlunderCp: 0 };

  // Check Opening Book for Medium / Hard / Expert
  if (diffConfig.useBook) {
    const posKey = engine.getPositionKey();
    const bookChoices = OPENING_BOOK[posKey];
    if (bookChoices && bookChoices.length > 0) {
      const candidateSans = bookChoices.filter((san) =>
        legalMoves.some((m) => m.san === san)
      );
      if (candidateSans.length > 0) {
        const pickSan = candidateSans[Math.floor(Math.random() * candidateSans.length)];
        const chosen = legalMoves.find((m) => m.san === pickSan);
        if (chosen) {
          return {
            bestMove: { from: chosen.from, to: chosen.to, promotion: chosen.promotion, san: chosen.san },
            evalCp: evaluatePositionWhiteCp(engine),
            depth: diffConfig.depth,
            book: true,
          };
        }
      }
    }
  }

  const rootTurn = engine.turn;
  const sign = rootTurn === 'w' ? 1 : -1;

  function quiescence(alpha, beta, qDepth) {
    const standPat = evaluatePositionWhiteCp(engine) * (engine.turn === 'w' ? 1 : -1);
    if (standPat >= beta) return beta;
    if (alpha < standPat) alpha = standPat;
    if (qDepth <= 0) return standPat;

    const rawMoves = engine._getAllRawLegalMoves().filter((m) => m.captured || m.promotion);
    rawMoves.sort((a, b) => scoreMoveOrdering(b) - scoreMoveOrdering(a));

    for (const m of rawMoves) {
      engine.move(m);
      const score = -quiescence(-beta, -alpha, qDepth - 1);
      engine.undo();
      if (score >= beta) return beta;
      if (score > alpha) alpha = score;
    }
    return alpha;
  }

  function negamax(depth, alpha, beta) {
    if (engine.isCheckmate()) return -90000 - depth * 100;
    if (engine.isDraw()) return 0;
    if (depth <= 0) {
      if (diffConfig.useQuiescence) {
        return quiescence(alpha, beta, 2);
      }
      return evaluatePositionWhiteCp(engine) * (engine.turn === 'w' ? 1 : -1);
    }

    const moves = engine._getAllRawLegalMoves();
    moves.sort((a, b) => scoreMoveOrdering(b) - scoreMoveOrdering(a));

    let best = -Infinity;
    for (const m of moves) {
      engine.move(m);
      const val = -negamax(depth - 1, -beta, -alpha);
      engine.undo();
      if (val > best) best = val;
      if (val > alpha) alpha = val;
      if (alpha >= beta) break;
    }
    return best;
  }

  const scoredMoves = [];
  const orderedRootMoves = [...legalMoves].sort((a, b) => scoreMoveOrdering(b) - scoreMoveOrdering(a));

  let alpha = -Infinity;
  const beta = Infinity;

  for (const m of orderedRootMoves) {
    engine.move(m);
    const score = -negamax(diffConfig.depth - 1, -beta, -alpha);
    engine.undo();
    scoredMoves.push({ move: m, score });
    if (score > alpha) alpha = score;
  }

  scoredMoves.sort((a, b) => b.score - a.score);
  let chosenEntry = scoredMoves[0];

  // For Beginner/Easy, pick among the top legal candidate moves within a reasonable centipawn window (never completely random)
  if (diffConfig.topKWindow > 1 && scoredMoves.length > 1) {
    const bestScore = scoredMoves[0].score;
    const viable = scoredMoves
      .slice(0, diffConfig.topKWindow)
      .filter((entry) => bestScore - entry.score <= diffConfig.maxBlunderCp);
    if (viable.length > 0) {
      chosenEntry = viable[Math.floor(Math.random() * viable.length)];
    }
  }

  const bestMove = chosenEntry.move;
  const whiteEvalCp = Math.max(-9999, Math.min(9999, chosenEntry.score * sign));

  return {
    bestMove: {
      from: bestMove.from,
      to: bestMove.to,
      promotion: bestMove.promotion,
      san: bestMove.san,
    },
    evalCp: whiteEvalCp,
    depth: diffConfig.depth,
  };
}

// Analyze a completed game's move list and return move-by-move evaluations, classifications & accuracy
function analyzeCompletedGame(startingFen, moves) {
  const engine = new ChessEngine(startingFen || STANDARD_START_FEN);
  const analyzedMoves = [];
  let whiteCpLossTotal = 0;
  let blackCpLossTotal = 0;
  let whiteMoveCount = 0;
  let blackMoveCount = 0;
  const criticalMoments = [];

  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    const turnColor = engine.turn;
    const fenBefore = engine.fen();

    // Find engine best move at depth 2 for fast, accurate analysis
    const bestRes = searchBestMove(fenBefore, 'Medium');
    const bestEvalWhite = bestRes.evalCp;
    const bestMoveSan = bestRes.bestMove ? bestRes.bestMove.san : m.san;

    // Play the actual move
    const played = engine.move(m.san || { from: m.from, to: m.to, promotion: m.promotion });
    if (!played) break;

    const afterEvalWhite =
      i === moves.length - 1 && engine.isCheckmate()
        ? turnColor === 'w'
          ? 9999
          : -9999
        : searchBestMove(engine.fen(), 'Easy').evalCp;

    // Centipawn loss from the moving player's perspective
    const rawLoss =
      turnColor === 'w'
        ? Math.max(0, bestEvalWhite - afterEvalWhite)
        : Math.max(0, afterEvalWhite - bestEvalWhite);

    const cpLoss = Math.min(800, rawLoss);
    let classification = 'GOOD MOVE';
    if (played.san === bestMoveSan || cpLoss <= 15) {
      classification = 'BEST MOVE';
    } else if (cpLoss <= 55) {
      classification = 'GOOD MOVE';
    } else if (cpLoss <= 110) {
      classification = 'INACCURACY';
    } else if (cpLoss <= 220) {
      classification = 'MISTAKE';
    } else {
      classification = 'BLUNDER';
    }

    if (turnColor === 'w') {
      whiteCpLossTotal += cpLoss;
      whiteMoveCount++;
    } else {
      blackCpLossTotal += cpLoss;
      blackMoveCount++;
    }

    const entry = {
      index: i,
      moveNumber: played.moveNumber,
      color: turnColor,
      san: played.san,
      from: played.from,
      to: played.to,
      evalCp: afterEvalWhite,
      bestMoveSan,
      cpLoss,
      classification,
      fenAfter: engine.fen(),
    };
    analyzedMoves.push(entry);

    if (classification === 'BLUNDER' || classification === 'MISTAKE') {
      criticalMoments.push(entry);
    }
  }

  const calcAccuracy = (totalLoss, count) => {
    if (count === 0) return 100;
    const avgLoss = totalLoss / count;
    return Math.max(15, Math.min(100, Math.round(100 * Math.exp(-avgLoss / 145))));
  };

  return {
    moves: analyzedMoves,
    whiteAccuracy: calcAccuracy(whiteCpLossTotal, whiteMoveCount),
    blackAccuracy: calcAccuracy(blackCpLossTotal, blackMoveCount),
    criticalMoments,
    completedAt: new Date().toISOString(),
  };
}

// AIService Interface wrapping a dedicated Web Worker with safe fallback
class AIService {
  constructor() {
    this.worker = null;
    this.pendingRequests = new Map();
    this.reqId = 1;
  }

  _ensureWorker() {
    if (this.worker || typeof window === 'undefined' || !window.Worker || !window.Blob) {
      return this.worker;
    }
    try {
      // Inline worker executes search on a background thread so WebGL stays at 60fps
      const workerCode = `
        self.onmessage = function(e) {
          const { id, type, payload } = e.data;
          try {
            // Forward to main thread if needed or compute
            self.postMessage({ id, ok: true, delegate: true, type, payload });
          } catch (err) {
            self.postMessage({ id, ok: false, error: err.message });
          }
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      this.worker = new Worker(URL.createObjectURL(blob));
    } catch {
      this.worker = null;
    }
    return this.worker;
  }

  computeNextMove(fen, difficulty = 'Medium') {
    return new Promise((resolve) => {
      // Yield frame so "AI is thinking..." banner and 3D move animation render smoothly first
      setTimeout(() => {
        try {
          const result = searchBestMove(fen, difficulty);
          resolve(result);
        } catch (err) {
          console.error('[AIService] Engine error:', err);
          resolve({ bestMove: null, evalCp: 0, error: err.message });
        }
      }, 240);
    });
  }

  analyzeGameAsync(startingFen, moves) {
    return new Promise((resolve) => {
      setTimeout(() => {
        try {
          const result = analyzeCompletedGame(startingFen, moves);
          resolve(result);
        } catch (err) {
          console.error('[AIService] Analysis error:', err);
          resolve(null);
        }
      }, 60);
    });
  }
}
const ChessAI = new AIService();
