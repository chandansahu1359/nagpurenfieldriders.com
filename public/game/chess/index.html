// Modular 3D Chess Piece Mesh Builder supporting all 8 Piece Styles:
// 1. Classic, 2. Modern, 3. Luxury, 4. Medieval, 5. Futuristic,
// 6. Crystal, 7. Metallic, 8. Minimal
// ============================================================================

function computeVertexNormals(positions, indices) {
  const normals = new Float32Array(positions.length);
  for (let i = 0; i < indices.length; i += 3) {
    const i0 = indices[i] * 3;
    const i1 = indices[i + 1] * 3;
    const i2 = indices[i + 2] * 3;

    const ax = positions[i1] - positions[i0];
    const ay = positions[i1 + 1] - positions[i0 + 1];
    const az = positions[i1 + 2] - positions[i0 + 2];

    const bx = positions[i2] - positions[i0];
    const by = positions[i2 + 1] - positions[i0 + 1];
    const bz = positions[i2 + 2] - positions[i0 + 2];

    const nx = ay * bz - az * by;
    const ny = az * bx - ax * bz;
    const nz = ax * by - ay * bx;

    normals[i0] += nx;
    normals[i0 + 1] += ny;
    normals[i0 + 2] += nz;

    normals[i1] += nx;
    normals[i1 + 1] += ny;
    normals[i1 + 2] += nz;

    normals[i2] += nx;
    normals[i2 + 1] += ny;
    normals[i2 + 2] += nz;
  }

  for (let i = 0; i < normals.length; i += 3) {
    const len = Math.hypot(normals[i], normals[i + 1], normals[i + 2]) || 1;
    normals[i] /= len;
    normals[i + 1] /= len;
    normals[i + 2] /= len;
  }
  return normals;
}
function createLatheBuffer(profile, segments = 24, flatShaded = false) {
  const positions = [];
  const indices = [];

  for (let i = 0; i < profile.length; i++) {
    const [r, y] = profile[i];
    for (let s = 0; s <= segments; s++) {
      const theta = (s / segments) * Math.PI * 2;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      positions.push(x, y, z);
    }
  }

  const ringStride = segments + 1;
  for (let i = 0; i < profile.length - 1; i++) {
    for (let s = 0; s < segments; s++) {
      const a = i * ringStride + s;
      const b = a + ringStride;
      const c = b + 1;
      const d = a + 1;
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  return finalizeGeometry(positions, indices, flatShaded);
}
function createBoxBuffer(w, h, d, ox = 0, oy = 0, oz = 0) {
  const hw = w / 2;
  const hh = h / 2;
  const hd = d / 2;

  const corners = [
    [-hw + ox, -hh + oy,  hd + oz],
    [ hw + ox, -hh + oy,  hd + oz],
    [ hw + ox,  hh + oy,  hd + oz],
    [-hw + ox,  hh + oy,  hd + oz],
    [-hw + ox, -hh + oy, -hd + oz],
    [ hw + ox, -hh + oy, -hd + oz],
    [ hw + ox,  hh + oy, -hd + oz],
    [-hw + ox,  hh + oy, -hd + oz],
  ];

  const faces = [
    [0, 1, 2, 3], // front
    [5, 4, 7, 6], // back
    [3, 2, 6, 7], // top
    [4, 5, 1, 0], // bottom
    [1, 5, 6, 2], // right
    [4, 0, 3, 7], // left
  ];

  const positions = [];
  const indices = [];
  let vIdx = 0;
  for (const [a, b, c, d] of faces) {
    positions.push(...corners[a], ...corners[b], ...corners[c], ...corners[d]);
    indices.push(vIdx, vIdx + 1, vIdx + 2, vIdx, vIdx + 2, vIdx + 3);
    vIdx += 4;
  }
  return finalizeGeometry(positions, indices, true);
}
function mergeGeometries(geoms) {
  let totalVerts = 0;
  let totalIndices = 0;
  for (const g of geoms) {
    totalVerts += g.positions.length;
    totalIndices += g.indices.length;
  }

  const positions = new Float32Array(totalVerts);
  const normals = new Float32Array(totalVerts);
  const indices = new Uint16Array(totalIndices);

  let vOffset = 0;
  let iOffset = 0;
  let vertexCountOffset = 0;

  for (const g of geoms) {
    positions.set(g.positions, vOffset);
    normals.set(g.normals, vOffset);
    for (let i = 0; i < g.indices.length; i++) {
      indices[iOffset + i] = g.indices[i] + vertexCountOffset;
    }
    vOffset += g.positions.length;
    iOffset += g.indices.length;
    vertexCountOffset += g.positions.length / 3;
  }

  return { positions, normals, indices };
}

function finalizeGeometry(posArray, idxArray, flatShaded = false) {
  if (flatShaded) {
    const flatPos = new Float32Array(idxArray.length * 3);
    const flatNorm = new Float32Array(idxArray.length * 3);
    const flatIdx = new Uint16Array(idxArray.length);
    for (let i = 0; i < idxArray.length; i += 3) {
      const i0 = idxArray[i] * 3;
      const i1 = idxArray[i + 1] * 3;
      const i2 = idxArray[i + 2] * 3;

      const ax = posArray[i1] - posArray[i0];
      const ay = posArray[i1 + 1] - posArray[i0 + 1];
      const az = posArray[i1 + 2] - posArray[i0 + 2];

      const bx = posArray[i2] - posArray[i0];
      const by = posArray[i2 + 1] - posArray[i0 + 1];
      const bz = posArray[i2 + 2] - posArray[i0 + 2];

      let nx = ay * bz - az * by;
      let ny = az * bx - ax * bz;
      let nz = ax * by - ay * bx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len;
      ny /= len;
      nz /= len;

      for (let k = 0; k < 3; k++) {
        const src = idxArray[i + k] * 3;
        const dst = (i + k) * 3;
        flatPos[dst] = posArray[src];
        flatPos[dst + 1] = posArray[src + 1];
        flatPos[dst + 2] = posArray[src + 2];
        flatNorm[dst] = nx;
        flatNorm[dst + 1] = ny;
        flatNorm[dst + 2] = nz;
        flatIdx[i + k] = i + k;
      }
    }
    return { positions: flatPos, normals: flatNorm, indices: flatIdx };
  }

  const positions = new Float32Array(posArray);
  const indices = new Uint16Array(idxArray);
  const normals = computeVertexNormals(positions, indices);
  return { positions, normals, indices };
}

// Sculpted 3D Knight Head & Mane mesh mounted atop the knight pedestal
function createKnightHeadGeometry(baseY, scale = 1.0, style = 'Classic') {
  const parts = [];
  const flat = style === 'Crystal' || style === 'Futuristic' || style === 'Minimal';

  if (style === 'Minimal') {
    // Sleek Bauhaus angled wedge + cylinder base
    parts.push(createBoxBuffer(0.32 * scale, 0.55 * scale, 0.36 * scale, 0, baseY + 0.28 * scale, 0));
    parts.push(createBoxBuffer(0.26 * scale, 0.24 * scale, 0.44 * scale, 0, baseY + 0.52 * scale, 0.10 * scale));
    return mergeGeometries(parts);
  }

  // Sculpted equine neck, jaw, muzzle, ears, and dorsal mane ridge
  const slices = [
    { y: baseY + 0.00 * scale, zCenter:  0.00, rx: 0.24 * scale, rz: 0.25 * scale },
    { y: baseY + 0.14 * scale, zCenter: -0.02 * scale, rx: 0.21 * scale, rz: 0.24 * scale },
    { y: baseY + 0.30 * scale, zCenter: -0.04 * scale, rx: 0.19 * scale, rz: 0.25 * scale },
    { y: baseY + 0.46 * scale, zCenter:  0.02 * scale, rx: 0.17 * scale, rz: 0.28 * scale },
    { y: baseY + 0.58 * scale, zCenter:  0.12 * scale, rx: 0.14 * scale, rz: 0.31 * scale },
    { y: baseY + 0.64 * scale, zCenter:  0.22 * scale, rx: 0.11 * scale, rz: 0.22 * scale },
    { y: baseY + 0.72 * scale, zCenter:  0.02 * scale, rx: 0.12 * scale, rz: 0.16 * scale },
    { y: baseY + 0.78 * scale, zCenter: -0.05 * scale, rx: 0.05 * scale, rz: 0.07 * scale },
  ];

  const segs = style === 'Crystal' ? 6 : style === 'Futuristic' ? 8 : 16;
  const positions = [];
  const indices = [];

  for (let i = 0; i < slices.length; i++) {
    const sl = slices[i];
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * Math.PI * 2;
      const x = Math.cos(a) * sl.rx;
      const z = sl.zCenter + Math.sin(a) * sl.rz;
      positions.push(x, sl.y, z);
    }
  }

  const stride = segs + 1;
  for (let i = 0; i < slices.length - 1; i++) {
    for (let s = 0; s < segs; s++) {
      const a = i * stride + s;
      const b = a + stride;
      const c = b + 1;
      const d = a + 1;
      indices.push(a, b, d, b, c, d);
    }
  }
  parts.push(finalizeGeometry(positions, indices, flat));

  // Two sculpted ears
  parts.push(createBoxBuffer(0.06 * scale, 0.15 * scale, 0.08 * scale, -0.08 * scale, baseY + 0.77 * scale, -0.04 * scale));
  parts.push(createBoxBuffer(0.06 * scale, 0.15 * scale, 0.08 * scale,  0.08 * scale, baseY + 0.77 * scale, -0.04 * scale));

  return mergeGeometries(parts);
}

// Build complete 3D piece geometry for a given type ('p','r','n','b','q','k') and style
function buildPieceGeometry(type, style = 'Classic') {
  const isCrystal = style === 'Crystal';

  const isMinimal = style === 'Minimal';
  const isMedieval = style === 'Medieval';
  const isLuxury = style === 'Luxury';
  const isModern = style === 'Modern';

  const segs = isCrystal ? 7 : isFuturistic ? 8 : isMinimal ? 16 : 24;
  const flat = isCrystal || isFuturistic;

  // Base pedestal profile shared across pieces, customized by style
  const baseRing = isLuxury
    ? [
        [0.0, 0.0],
        [0.39, 0.0],
        [0.39, 0.06],
        [0.35, 0.10],
        [0.37, 0.14],
        [0.31, 0.19],
        [0.33, 0.23],

      ]

    );
    this._uploadGeometry(
      'capture_ring',
      createLatheBuffer([[0.32, 0.01], [0.42, 0.01], [0.42, 0.05], [0.32, 0.05], [0.32, 0.01]], 20, false)
    );
    this._uploadGeometry(
      'env_pillar',
      createLatheBuffer([[0, 0], [0.55, 0], [0.55, 0.3], [0.42, 0.4], [0.38, 5.5], [0.52, 5.8], [0, 5.8]], 14, false)
    );
    this._uploadGeometry(
      'space_ring',
      createLatheBuffer([[7.2, -0.05], [7.8, -0.05], [7.8, 0.05], [7.2, 0.05], [7.2, -0.05]], 28, false)
    );
    this._uploadGeometry('particle', createBoxBuffer(1, 1, 1, 0, 0, 0));
  }

  getPieceMesh(type, style) {
    const key = `piece_${style}_${type}`;
    if (this.meshCache.has(key)) return this.meshCache.get(key);
    const geom = buildPieceGeometry(type, style);
    return this._uploadGeometry(key, geom);
  }

  setCameraPreset(presetId, perspectiveColor = 'w') {
    const preset =
      Object.values(CameraPresets).find((p) => p.id === presetId) || CameraPresets.CLASSIC;
    const baseTheta = perspectiveColor === 'b' ? Math.PI + preset.theta : preset.theta;
    this.camera.targetTheta = baseTheta;
    this.camera.targetPhi = preset.phi;
    this.camera.targetRadius = preset.radius;
    this.camera.targetCenter = [...preset.target];
    this.camera.targetFov = preset.fov;
    this.needsRender = true;
  }

  resetCamera(perspectiveColor = 'w') {
    const defaultPreset = this.settings?.camera?.defaultPreset || 'classic';
    this.setCameraPreset(defaultPreset, perspectiveColor);
  }

  rotateToSide(color, subtleCinematicOffset = 0) {
    const baseTheta = color === 'b' ? Math.PI : 0;
    this.camera.targetTheta = baseTheta + subtleCinematicOffset;
    this.needsRender = true;
  }

  triggerAutoCameraMove(move, currentTurnColor, mode, playerColor) {
    if (!this.settings?.gameplay?.autoCamera) return;
    if (this.settings?.accessibility?.reducedMotion) return;

    const boardRot = this.settings?.board?.boardRotation || 'auto';
    let targetSide = 'w';
    if (boardRot === 'black') targetSide = 'b';
    else if (boardRot === 'white') targetSide = 'w';
    else if (mode === 'local') targetSide = currentTurnColor;
    else targetSide = playerColor || 'w';

    const drift =
      move && (move.captured || (move.san && move.san.includes('+')))
        ? (move.toCol - 3.5) * 0.045
        : 0;
    this.rotateToSide(targetSide, drift);
  }

  _bindInteractions() {
    let isDragging = false;
    let dragButton = 0;
    let lastX = 0;
    let lastY = 0;
    let movedDistance = 0;
    let pinchStartDist = 0;

    const getSensitivity = () => this.settings?.camera?.sensitivity ?? 1.0;
    const getZoomSens = () => this.settings?.camera?.zoomSensitivity ?? 1.0;

    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    this.canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragButton = e.button;
      lastX = e.clientX;
      lastY = e.clientY;
      movedDistance = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) {
        if (e.target === this.canvas) {
          const sq = this.pickSquareAtClientPos(e.clientX, e.clientY);
          if (sq !== this.hoveredSquare) {
            this.hoveredSquare = sq;
            this.needsRender = true;
          }
          this.canvas.style.cursor = sq ? 'pointer' : 'grab';
        }
        return;
      }

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      movedDistance += Math.hypot(dx, dy);

      const sens = getSensitivity();
      if (dragButton === 2 || e.shiftKey) {
        const panScale = 0.012 * sens;
        const cosT = Math.cos(this.camera.theta);
        const sinT = Math.sin(this.camera.theta);
        this.camera.targetCenter[0] = Math.max(
          -3.5,
          Math.min(3.5, this.camera.targetCenter[0] - dx * cosT * panScale)
        );
        this.camera.targetCenter[2] = Math.max(
          -3.5,
          Math.min(3.5, this.camera.targetCenter[2] - (-dx * sinT + dy) * panScale)
        );
      } else {
        this.camera.targetTheta -= dx * 0.0075 * sens;
        this.camera.targetPhi = Math.max(
          0.08,
          Math.min(1.42, this.camera.targetPhi - dy * 0.0065 * sens)
        );
      }
      this.needsRender = true;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (movedDistance < 6 && dragButton === 0 && e.target === this.canvas) {
        const sq = this.pickSquareAtClientPos(e.clientX, e.clientY);
        if (sq && this.callbacks.onSquareClick) {
          this.callbacks.onSquareClick(sq);
        }
      }
    });

    this.canvas.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        const zSens = getZoomSens();
        this.camera.targetRadius = Math.max(
          6.8,
          Math.min(22.0, this.camera.targetRadius + e.deltaY * 0.008 * zSens)
        );
        this.needsRender = true;
      },
      { passive: false }
    );

    this.canvas.addEventListener(
      'touchstart',
      (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          movedDistance = 0;
        } else if (e.touches.length === 2) {
          isDragging = false;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      },
      { passive: true }
    );

    this.canvas.addEventListener(
      'touchmove',
      (e) => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - lastX;
          const dy = e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          movedDistance += Math.hypot(dx, dy);
          const sens = getSensitivity();
          this.camera.targetTheta -= dx * 0.0075 * sens;
          this.camera.targetPhi = Math.max(
            0.08,
            Math.min(1.42, this.camera.targetPhi - dy * 0.0065 * sens)
          );
          this.needsRender = true;
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = pinchStartDist - dist;
          pinchStartDist = dist;
          this.camera.targetRadius = Math.max(
            6.8,
            Math.min(22.0, this.camera.targetRadius + delta * 0.03)
          );
          this.needsRender = true;
        }
      },
      { passive: true }
    );

    this.canvas.addEventListener('touchend', (e) => {
      if (isDragging && movedDistance < 10 && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const sq = this.pickSquareAtClientPos(t.clientX, t.clientY);
        if (sq && this.callbacks.onSquareClick) {
          this.callbacks.onSquareClick(sq);
        }
      }
      isDragging = false;
    });

    window.addEventListener('resize', () => {
      this.needsRender = true;
    });
  }

  pickSquareAtClientPos(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);

    const { origin, dir } = unprojectNearFar(ndcX, ndcY, this.invVpMatrix);

    let bestPieceSq = null;
    let bestT = Infinity;

    for (const p of this.boardPieces) {
      const { x: wx, z: wz } = boardCoordsToWorld(p.row, p.col);
      const height = p.type === 'k' || p.type === 'q' ? 1.55 : p.type === 'p' ? 1.0 : 1.3;
      const radius = 0.38;

      for (const sampleY of [0.25, 0.55, 0.85, height * 0.75]) {
        const ocx = origin[0] - wx;
        const ocy = origin[1] - sampleY;
        const ocz = origin[2] - wz;
        const b = ocx * dir[0] + ocy * dir[1] + ocz * dir[2];
        const c = ocx * ocx + ocy * ocy + ocz * ocz - radius * radius;
        const disc = b * b - c;
        if (disc >= 0) {
          const t = -b - Math.sqrt(disc);
          if (t > 0 && t < bestT) {
            bestT = t;
            bestPieceSq = p.square;
          }
        }
      }
    }

    if (Math.abs(dir[1]) > 1e-5) {
      const tPlane = -origin[1] / dir[1];
      if (tPlane > 0) {
        const hitX = origin[0] + dir[0] * tPlane;
        const hitZ = origin[2] + dir[2] * tPlane;
        const col = Math.floor(hitX + 4.0);
        const row = Math.floor(hitZ + 4.0);
        if (row >= 0 && row <= 7 && col >= 0 && col <= 7) {
          const planeSq = coordsToSquare(row, col);
          if (bestPieceSq && bestT < tPlane - 0.15) {
            return bestPieceSq;
          }
          return planeSq;
        }
      }
    }

    return bestPieceSq;
  }

  animateMove(moveRecord) {
    if (!moveRecord) return;
    const reducedMotion = this.settings?.accessibility?.reducedMotion;
    const speedMult = this.settings?.camera?.animationSpeed || 1.0;
    const duration = reducedMotion ? 10 : Math.round(280 / speedMult);

    const fromW = boardCoordsToWorld(moveRecord.fromRow, moveRecord.fromCol);
    const toW = boardCoordsToWorld(moveRecord.toRow, moveRecord.toCol);

    if (moveRecord.pieceId) {
      this.pieceAnimations.set(moveRecord.pieceId, {
        fromX: fromW.x,
        fromZ: fromW.z,
        toX: toW.x,
        toZ: toW.z,
        startTime: performance.now(),
        duration,
        isKnight: moveRecord.piece === 'n',
        isPromotion: Boolean(moveRecord.promotion),
      });
    }

    if (this.settings?.graphics?.particles && !reducedMotion) {
      if (moveRecord.captured) {
        this.spawnParticleBurst(toW.x, 0.35, toW.z, [1.0, 0.68, 0.25], 22);
      }
      if (moveRecord.promotion) {
        this.spawnParticleBurst(toW.x, 0.65, toW.z, [0.45, 0.88, 1.0], 26);
      }
      if (moveRecord.san && moveRecord.san.includes('#')) {
        this.spawnParticleBurst(toW.x, 0.8, toW.z, [1.0, 0.82, 0.28], 42);
      }
    }
    this.needsRender = true;
  }

  spawnParticleBurst(x, y, z, color, count = 20) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.03 + Math.random() * 0.08;
      this.particles.push({
        x,
        y,
        z,
        vx: Math.cos(angle) * speed,
        vy: 0.04 + Math.random() * 0.09,
        vz: Math.sin(angle) * speed,
        color,
        size: 0.05 + Math.random() * 0.06,
        life: 0,
        maxLife: 24 + Math.floor(Math.random() * 16),
      });
    }
    this.needsRender = true;
  }

  updateSceneState({
    boardPieces,
    selectedSquare,
    legalMoves,
    lastMove,
    checkSquare,
    settings,
    analysisMarkers,
  }) {
    if (boardPieces) this.boardPieces = boardPieces;
    this.selectedSquare = selectedSquare || null;
    this.legalMoves = legalMoves || [];
    this.lastMove = lastMove || null;
    this.checkSquare = checkSquare || null;
    if (settings) this.settings = settings;
    if (analysisMarkers !== undefined) this.analysisMarkers = analysisMarkers || {};
    this.needsRender = true;
  }

  getProjectedCoordinates() {
    const coords = [];
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
    const isBlackView = Math.cos(this.camera.theta) < 0;

    for (let c = 0; c < 8; c++) {
      const wx = (c - 3.5) * 1.0;
      const wz = isBlackView ? -4.28 : 4.28;
      const pt = projectWorldToScreen(wx, 0.02, wz, this.vpMatrix);
      if (pt) coords.push({ text: files[c].toUpperCase(), x: pt.x, y: pt.y, type: 'file' });
    }
    for (let r = 0; r < 8; r++) {
      const wx = isBlackView ? 4.28 : -4.28;
      const wz = (r - 3.5) * 1.0;
      const pt = projectWorldToScreen(wx, 0.02, wz, this.vpMatrix);
      if (pt) coords.push({ text: ranks[r], x: pt.x, y: pt.y, type: 'rank' });
    }
    return coords;
  }

  getProjectedAnalysisBadges() {
    const badges = [];
    if (!this.analysisMarkers) return badges;
    for (const [sq, info] of Object.entries(this.analysisMarkers)) {
      const c = squareToCoords(sq);
      if (!c) continue;
      const w = boardCoordsToWorld(c.row, c.col);
      const pt = projectWorldToScreen(w.x, 1.45, w.z, this.vpMatrix);
      if (pt) {
        badges.push({ square: sq, ...info, x: pt.x, y: pt.y });
      }
    }
    return badges;
  }

  startLoop(onFrameOverlayUpdate) {
    // Render initial frame immediately
    this.render(performance.now());
    if (onFrameOverlayUpdate) onFrameOverlayUpdate();

    this.loopTimer = setInterval(() => {
      if (this.isDisposed) return;
      const camMoving =
        Math.abs(this.camera.targetTheta - this.camera.theta) > 0.001 ||
        Math.abs(this.camera.targetPhi - this.camera.phi) > 0.001 ||
        Math.abs(this.camera.targetRadius - this.camera.radius) > 0.002 ||
        Math.abs(this.camera.targetFov - this.camera.fov) > 0.01;

      if (
        this.needsRender ||
        camMoving ||
        this.pieceAnimations.size > 0 ||
        this.particles.length > 0
      ) {
        this.needsRender = false;
        this.render(performance.now());
        if (onFrameOverlayUpdate) onFrameOverlayUpdate();
      }
    }, 33);
  }

  dispose() {
    this.isDisposed = true;
    if (this.loopTimer) clearInterval(this.loopTimer);
    if (this.gl) {
      for (const m of this.meshCache.values()) {
        this.gl.deleteBuffer(m.posBuf);
        this.gl.deleteBuffer(m.normBuf);
        this.gl.deleteBuffer(m.idxBuf);
      }
      this.meshCache.clear();
    }
  }

  _drawMesh(mesh, modelMatrix, material) {
    const gl = this.gl;
    if (!mesh) return;

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.posBuf);
    gl.enableVertexAttribArray(this.attribs.aPosition);
    gl.vertexAttribPointer(this.attribs.aPosition, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.normBuf);
    gl.enableVertexAttribArray(this.attribs.aNormal);
    gl.vertexAttribPointer(this.attribs.aNormal, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);

    gl.uniformMatrix4fv(this.uniforms.uModel, false, modelMatrix);
    gl.uniform3fv(this.uniforms.uBaseColor, material.color || [0.8, 0.8, 0.8]);
    gl.uniform3fv(this.uniforms.uSpecularColor, material.specular || [1.0, 1.0, 1.0]);
    gl.uniform1f(this.uniforms.uRoughness, material.roughness ?? 0.25);
    gl.uniform1f(this.uniforms.uMetalness, material.metalness ?? 0.15);
    gl.uniform1f(this.uniforms.uAlpha, material.alpha ?? 1.0);
    gl.uniform1f(this.uniforms.uEmissive, material.emissive ?? 0.0);
    gl.uniform3fv(this.uniforms.uEmissiveColor, material.emissiveColor || [0, 0, 0]);
    gl.uniform1i(this.uniforms.uShaderStyle, material.shaderStyle ?? 0);

    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  render(now = performance.now()) {
    const gl = this.gl;
    if (!gl || !this.program) return;

    const settings = this.settings || {};
    const quality = settings.graphics?.quality || 'HIGH';
    const dprCap = quality === 'LOW' ? 1.0 : quality === 'MEDIUM' ? 1.25 : 1.5;
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);

    const displayW = Math.max(1, Math.floor((this.canvas.clientWidth || window.innerWidth) * dpr));
    const displayH = Math.max(1, Math.floor((this.canvas.clientHeight || window.innerHeight) * dpr));
    if (this.canvas.width !== displayW || this.canvas.height !== displayH) {
      this.canvas.width = displayW;
      this.canvas.height = displayH;
    }

    gl.viewport(0, 0, displayW, displayH);

    const lerpFactor = settings.accessibility?.reducedMotion ? 1.0 : 0.22;
    this.camera.theta += (this.camera.targetTheta - this.camera.theta) * lerpFactor;
    this.camera.phi += (this.camera.targetPhi - this.camera.phi) * lerpFactor;
    this.camera.radius += (this.camera.targetRadius - this.camera.radius) * lerpFactor;
    this.camera.fov += (this.camera.targetFov - this.camera.fov) * lerpFactor;
    for (let i = 0; i < 3; i++) {
      this.camera.target[i] += (this.camera.targetCenter[i] - this.camera.target[i]) * lerpFactor;
    }

    const sinPhi = Math.sin(this.camera.phi);
    const cosPhi = Math.cos(this.camera.phi);
    const sinTheta = Math.sin(this.camera.theta);
    const cosTheta = Math.cos(this.camera.theta);

    const aspect = displayW / displayH;
    // Automatically adapt camera distance on narrow portrait viewports so the full 3D board fits
    const portraitScale = aspect < 1.0 ? Math.min(1.65, 1.0 / Math.pow(aspect, 0.58)) : 1.0;
    const effRadius = this.camera.radius * portraitScale;

    const eyeX = this.camera.target[0] + effRadius * sinPhi * sinTheta;
    const eyeY = this.camera.target[1] + effRadius * cosPhi;
    const eyeZ = this.camera.target[2] + effRadius * sinPhi * cosTheta;
    this.cameraEye = [eyeX, eyeY, eyeZ];
    const proj = mat4Perspective((this.camera.fov * Math.PI) / 180, aspect, 0.2, 80.0);
    const view = mat4LookAt(this.cameraEye, this.camera.target, [0, 1, 0]);
    this.vpMatrix = mat4Multiply(proj, view);
    this.invVpMatrix = mat4Invert(this.vpMatrix);

    const themeId = settings.board?.theme || 'ROYAL';
    const boardTheme = BOARD_THEMES[themeId] || BOARD_THEMES.ROYAL;
    const envId = settings.board?.environment || 'Royal Hall';
    const env = ENVIRONMENTS[envId] || ENVIRONMENTS['Royal Hall'];
    const pieceStyle = settings.board?.pieceSet || 'Classic';
    const whiteMat = WHITE_PIECE_COLORS[settings.board?.whitePieceColor] || WHITE_PIECE_COLORS.Ivory;
    const blackMat = BLACK_PIECE_COLORS[settings.board?.blackPieceColor] || BLACK_PIECE_COLORS.Obsidian;
    const highContrast = settings.accessibility?.highContrast;
    const colorBlind = settings.accessibility?.colorBlindMode;
    const pieceScale = settings.accessibility?.largerPieces ? 1.15 : 1.0;

    gl.clearColor(env.skyTop[0], env.skyTop[1], env.skyTop[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(this.program);
    const elapsedSec = (now - this.startTime) * 0.001;
    gl.uniformMatrix4fv(this.uniforms.uViewProj, false, this.vpMatrix);
    gl.uniform1f(this.uniforms.uTime, elapsedSec);
    gl.uniform3fv(this.uniforms.uCameraPos, this.cameraEye);
    gl.uniform3fv(this.uniforms.uAmbientColor, env.ambientColor);
    gl.uniform3fv(this.uniforms.uKeyLightPos, env.keyLightPos);
    gl.uniform3fv(this.uniforms.uKeyLightColor, env.keyLightColor);
    gl.uniform3fv(this.uniforms.uRimLightPos, env.rimLightPos);
    gl.uniform3fv(this.uniforms.uRimLightColor, env.rimLightColor);

    if (settings.graphics?.environmentEffects !== false && env.propType !== 'minimal') {
      this._drawMesh(
        this.meshCache.get('floor_pedestal'),
        mat4Identity(),
        {
          color: env.floorColor,
          specular: [0.5, 0.5, 0.6],
          roughness: 0.4,
          metalness: 0.25,
          shaderStyle: env.propType === 'cyber_grid' ? 5 : 2,
        }
      );

      if (env.propType === 'pillars') {
        const pillarMesh = this.meshCache.get('env_pillar');
        const corners = [[-7.2, -7.2], [7.2, -7.2], [-7.2, 7.2], [7.2, 7.2]];
        for (const [px, pz] of corners) {
          this._drawMesh(
            pillarMesh,
            mat4Compose(px, -0.55, pz, 0, 1, 1, 1),
            { color: [0.22, 0.20, 0.18], specular: [0.9, 0.8, 0.5], roughness: 0.3, metalness: 0.2, shaderStyle: 2 }
          );
        }
      } else if (env.propType === 'space_ring') {
        const ringMesh = this.meshCache.get('space_ring');
        this._drawMesh(
          ringMesh,
          mat4Compose(0, -0.1, 0, elapsedSec * 0.15, 1, 1, 1),
          { color: [0.35, 0.52, 0.95], specular: [1, 1, 1], roughness: 0.1, metalness: 0.8, emissive: 0.45, emissiveColor: [0.25, 0.4, 0.9] }
        );
      }
    }

    this._drawMesh(
      this.meshCache.get('board_chassis'),
      mat4Identity(),
      {
        color: boardTheme.frameColor,
        specular: boardTheme.frameTrim,
        roughness: boardTheme.roughness,
        metalness: boardTheme.metalness,
        shaderStyle: boardTheme.shaderStyle,
      }
    );
    this._drawMesh(
      this.meshCache.get('board_trim'),
      mat4Identity(),
      {
        color: boardTheme.frameTrim,
        specular: [1.0, 0.98, 0.9],
        roughness: 0.18,
        metalness: 0.78,
        shaderStyle: 0,
      }
    );

    const tileMesh = this.meshCache.get('square_tile');
    const dotMesh = this.meshCache.get('move_dot');
    const ringMesh = this.meshCache.get('capture_ring');

    const legalMap = new Map();
    if (settings.gameplay?.showLegalMoves !== false) {
      for (const m of this.legalMoves) {
        legalMap.set(m.to, m);
      }
    }

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = coordsToSquare(r, c);
        const isLight = (r + c) % 2 === 0;
        const { x: wx, z: wz } = boardCoordsToWorld(r, c);

        const sqColor = isLight
          ? highContrast
            ? [0.98, 0.98, 0.98]
            : boardTheme.lightSquare
          : highContrast
          ? [0.08, 0.09, 0.12]
          : boardTheme.darkSquare;

        let emissive = 0.0;
        let emissiveColor = [0, 0, 0];
        let yOffset = 0.0;

        const isSelected = this.selectedSquare === sq;
        const isHovered = this.hoveredSquare === sq;
        const isLastMove =
          settings.gameplay?.highlightLastMove !== false &&
          this.lastMove &&
          (this.lastMove.from === sq || this.lastMove.to === sq);
        const isCheckSq =
          settings.gameplay?.highlightCheck !== false && this.checkSquare === sq;

        if (isSelected) {
          yOffset = 0.045;
          emissive = 0.42;
          emissiveColor = colorBlind ? [0.15, 0.65, 1.0] : boardTheme.glowColor;
        } else if (isCheckSq) {
          emissive = 0.72;
          emissiveColor = [1.0, 0.14, 0.18];
        } else if (isLastMove) {
          emissive = 0.24;
          emissiveColor = colorBlind ? [0.2, 0.68, 0.98] : boardTheme.glowColor;
        } else if (isHovered) {
          yOffset = 0.018;
          emissive = 0.12;
          emissiveColor = boardTheme.glowColor;
        }

        const tileAlpha = settings.graphics?.reflections ? 0.92 : 1.0;

        this._drawMesh(
          tileMesh,
          mat4Compose(wx, yOffset, wz, 0, 1, 1, 1),
          {
            color: sqColor,
            specular: [0.95, 0.95, 0.98],
            roughness: boardTheme.roughness,
            metalness: boardTheme.metalness,
            alpha: tileAlpha,
            emissive,
            emissiveColor,
            shaderStyle: boardTheme.shaderStyle,
          }
        );

        const legal = legalMap.get(sq);
        if (legal) {
          if (legal.captured) {
            this._drawMesh(
              ringMesh,
              mat4Compose(wx, 0.025, wz, 0, 1, 1, 1),
              {
                color: colorBlind ? [1.0, 0.55, 0.0] : [0.98, 0.26, 0.32],
                specular: [1, 1, 1],
                roughness: 0.15,
                metalness: 0.5,
                emissive: 0.55,
                emissiveColor: colorBlind ? [1.0, 0.55, 0.0] : [0.98, 0.22, 0.28],
              }
            );
          } else {
            this._drawMesh(
              dotMesh,
              mat4Compose(wx, 0.02, wz, 0, 1, 1, 1),
              {
                color: colorBlind ? [0.15, 0.72, 1.0] : [0.22, 0.88, 0.56],
                specular: [1, 1, 1],
                roughness: 0.15,
                metalness: 0.4,
                emissive: 0.48,
                emissiveColor: colorBlind ? [0.15, 0.72, 1.0] : [0.18, 0.85, 0.52],
              }
            );
          }
        }
      }
    }

    for (const p of this.boardPieces) {
      const mesh = this.getPieceMesh(p.type, pieceStyle);
      if (!mesh) continue;

      const targetW = boardCoordsToWorld(p.row, p.col);
      let wx = targetW.x;
      let wy = 0.0;
      let wz = targetW.z;

      const anim = this.pieceAnimations.get(p.id);
      if (anim) {
        const t = Math.min(1.0, (now - anim.startTime) / anim.duration);
        if (t >= 1.0) {
          this.pieceAnimations.delete(p.id);
        } else {
          const ease = t * t * (3.0 - 2.0 * t);
          wx = anim.fromX + (anim.toX - anim.fromX) * ease;
          wz = anim.fromZ + (anim.toZ - anim.fromZ) * ease;
          const arcHeight = anim.isKnight ? 0.95 : 0.42;
          wy = Math.sin(t * Math.PI) * arcHeight;
        }
      }

      const isSelected = this.selectedSquare === p.square;
      const isKingCheck = this.checkSquare === p.square && p.type === 'k';
      if (isSelected) {
        wy += 0.18;
      }

      const matConfig = p.color === 'w' ? whiteMat : blackMat;
      const ry = p.type === 'n' ? (p.color === 'w' ? Math.PI : 0) : 0;

      if (settings.graphics?.reflections && quality !== 'LOW') {
        this._drawMesh(
          mesh,
          mat4Compose(wx, -wy - 0.04, wz, ry, pieceScale, -pieceScale * 0.85, pieceScale),
          {
            color: matConfig.color,
            specular: matConfig.specular,
            roughness: matConfig.roughness,
            metalness: matConfig.metalness,
            alpha: 0.18,
            shaderStyle: 0,
          }
        );
      }

      if (settings.graphics?.shadows !== false && quality !== 'LOW') {
        const shadowScale = Math.max(0.55, 1.05 - wy * 0.25) * pieceScale;
        this._drawMesh(
          dotMesh,
          mat4Compose(wx + 0.07, 0.006, wz + 0.07, 0, shadowScale * 2.2, 0.25, shadowScale * 2.2),
          {
            color: [0, 0, 0],
            alpha: 0.36,
            shaderStyle: 6,
          }
        );
      }

      this._drawMesh(
        mesh,
        mat4Compose(wx, wy, wz, ry, pieceScale, pieceScale, pieceScale),
        {
          color: matConfig.color,
          specular: matConfig.specular,
          roughness: matConfig.roughness,
          metalness: matConfig.metalness,
          alpha: matConfig.alpha ?? 1.0,
          emissive: isKingCheck ? 0.55 : isSelected ? 0.24 : 0.0,
          emissiveColor: isKingCheck
            ? [1.0, 0.12, 0.15]
            : isSelected
            ? boardTheme.glowColor
            : [0, 0, 0],
          shaderStyle: 0,
        }
      );
    }

    if (this.particles.length > 0) {
      const partMesh = this.meshCache.get('particle');
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const pt = this.particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.z += pt.vz;
        pt.vy -= 0.0035;
        pt.life++;
        if (pt.life >= pt.maxLife || pt.y < -0.2) {
          this.particles.splice(i, 1);
          continue;
        }
        const fade = 1.0 - pt.life / pt.maxLife;
        const s = pt.size * fade;
        this._drawMesh(
          partMesh,
          mat4Compose(pt.x, pt.y, pt.z, pt.life * 0.2, s, s, s),
          {
            color: pt.color,
            specular: [1, 1, 1],
            roughness: 0.1,
            metalness: 0.5,
            alpha: fade,
            emissive: 0.75,
            emissiveColor: pt.color,
          }
        );
      }
    }
  }
}

// src/state/appController.js
// Central Game State Machine, UI Renderer, Clock Manager, Replay & Analysis
// Controller, Puzzle Trainer, and Keyboard Shortcut Handler

const UNICODE_PIECES = {
  w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
  b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' },
};

function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const mins = Math.floor(s / 60);
  const rem = s % 60;
  return `${mins}:${rem < 10 ? '0' : ''}${rem}`;
}

function formatClockMs(ms, isUnlimited = false) {
  if (isUnlimited) return '∞';
  const clamped = Math.max(0, ms || 0);
  const totalSec = Math.floor(clamped / 1000);
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;
  if (mins === 0 && totalSec < 10) {
    const tenths = Math.floor((clamped % 1000) / 100);
    return `0:${secs < 10 ? '0' : ''}${secs}.${tenths}`;
  }
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
class SovereignChessApp {
  constructor() {
    this.settings = SettingsStorage.load();
    this.profile = ProfileStorage.load();
    this.engine = new ChessEngine(STANDARD_START_FEN);
    this.reviewEngine = null; // Used when inspecting an old move or replaying

    // Explicit Central Game State
    this.gameState = GameState.IDLE;
    this.screen = 'HOME'; // 'HOME' | 'GAME' | 'PUZZLES'
    this.activeModal = null; // null | 'SETUP' | 'HISTORY' | 'STATS' | 'CUSTOMIZE' | 'SETTINGS' | 'PGN' | 'HELP'
    this.settingsTab = 'GAMEPLAY';

    // Current Match Record
    this.currentGame = null;
    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this.pendingPromotionMove = null; // { from, to, color }
    this.pendingConfirmMove = null; // move object awaiting confirmation
    this.pendingDrawOfferFrom = null; // 'w' | 'b' | null
    this.showResultOverlay = false;

    // Evaluation & Analysis
    this.currentEvalCp = 0;
    this.activeAnalysis = null;

    // Review / Replay State
    this.reviewMoveIndex = null; // null means live board; 0..moves.length means historical step
    this.replayPlaying = false;
    this.replaySpeed = 1;
    this.replayTimer = null;

    // Clocks
    this.clockInterval = null;
    this.lastClockTick = null;

    // History Filters
    this.historyFilter = 'All';
    this.historySort = 'Newest';
    this.historySearch = '';

    // Puzzle State
    this.puzzleCategory = 'All';
    this.currentPuzzle = BUILTIN_PUZZLES[0];
    this.puzzleStepIndex = 0;
    this.puzzleStatus = 'solving'; // 'solving' | 'correct' | 'wrong'
    this.puzzleMessage = 'Find the best move!';
    this.puzzleShowHint = false;

    // Setup Modal Form State
    this.setupForm = {
      mode: GameMode.AI,
      aiDifficulty: AIDifficulty.MEDIUM,
      playerColor: 'w',
      timeControl: '10+0',
      theme: this.settings.board.theme,
      pieceSet: this.settings.board.pieceSet,
      whitePieceColor: this.settings.board.whitePieceColor,
      blackPieceColor: this.settings.board.blackPieceColor,
      environment: this.settings.board.environment,
      customFen: STANDARD_START_FEN,
    };

    this.scene3D = null;
  }

  async init() {
    await GameStorage.init();
    this._applySettingsClasses();

    const canvas = document.getElementById('chess-canvas');
    this.scene3D = new ChessScene3D(canvas, {
      onSquareClick: (sq) => this.handleSquareClick(sq),
    });

    this.scene3D.resetCamera('w');
    this._sync3DScene();

    this.scene3D.startLoop(() => {
      this._updateBoardOverlay();
    });

    this._bindGlobalShortcuts();
    this._startClockLoop();
    this.renderUI();
  }

  _applySettingsClasses() {
    document.body.classList.toggle('high-contrast', Boolean(this.settings.accessibility.highContrast));
    document.body.classList.toggle('bloom-enabled', Boolean(this.settings.graphics.bloom && this.settings.graphics.quality !== 'LOW'));
    SoundSystem.syncMusicState();
  }

  showToast(message) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'toast-item';
    el.innerHTML = `<span style="color:var(--accent-gold)">★</span> <span>${escapeHtml(message)}</span>`;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.25s ease';
      setTimeout(() => el.remove(), 260);
    }, 3100);
  }

  // --------------------------------------------------------------------------
  // 3D Scene & Overlay Synchronization
  // --------------------------------------------------------------------------
  _getActiveDisplayEngine() {
    if (this.reviewMoveIndex !== null && this.reviewEngine) {
      return this.reviewEngine;
    }
    return this.engine;
  }

  _sync3DScene() {
    if (!this.scene3D) return;
    const dispEngine = this._getActiveDisplayEngine();
    const pieces = dispEngine.getBoardPieces();
    const hist = dispEngine.history;
    const lastMove = hist.length > 0 ? hist[hist.length - 1] : null;

    let checkSq = null;
    if (dispEngine.inCheck()) {
      const k = dispEngine.findKingSquare(dispEngine.turn);
      if (k) checkSq = k.square;
    }

    // Build analysis markers for current move in replay/analysis
    const analysisMarkers = {};
    if (this.activeAnalysis && this.activeAnalysis.moves) {
      const idx =
        this.reviewMoveIndex !== null
          ? this.reviewMoveIndex - 1
          : this.engine.history.length - 1;
      const aMove = this.activeAnalysis.moves[idx];
      if (aMove) {
        const badgeColors = {
          'BEST MOVE': '#10b981',
          'GOOD MOVE': '#38bdf8',
          'INACCURACY': '#fbbf24',
          'MISTAKE': '#f97316',
          'BLUNDER': '#f43f5e',
        };
        analysisMarkers[aMove.to] = {
          classification: aMove.classification,
          color: badgeColors[aMove.classification] || '#38bdf8',
          san: aMove.san,
        };
      }
    }

    this.scene3D.updateSceneState({
      boardPieces: pieces,
      selectedSquare: this.reviewMoveIndex === null ? this.selectedSquare : null,
      legalMoves: this.reviewMoveIndex === null ? this.legalMovesForSelected : [],
      lastMove,
      checkSquare: checkSq,
      settings: this.settings,
      analysisMarkers,
    });
  }

  _updateBoardOverlay() {
    const overlay = document.getElementById('board-overlay-layer');
    if (!overlay || !this.scene3D) return;

    const showCoords =
      this.settings.gameplay.showCoordinates &&
      this.settings.board.coordinateStyle !== 'hidden';
    const coords = showCoords ? this.scene3D.getProjectedCoordinates() : [];
    const badges = this.scene3D.getProjectedAnalysisBadges();

    let html = '';
    for (const c of coords) {
      if (c.x < 0.02 || c.x > 0.98 || c.y < 0.04 || c.y > 0.96) continue;
      html += `<div class="coord-marker" style="left:${(c.x * 100).toFixed(2)}%;top:${(c.y * 100).toFixed(2)}%">${c.text}</div>`;
    }
    for (const b of badges) {
      if (b.x < 0.02 || b.x > 0.98 || b.y < 0.04 || b.y > 0.96) continue;
      html += `<div class="analysis-3d-badge" style="left:${(b.x * 100).toFixed(2)}%;top:${(b.y * 100).toFixed(2)}%;background:${b.color};color:#06080e">${escapeHtml(b.classification)} (${escapeHtml(b.san)})</div>`;
    }
    if (overlay.innerHTML !== html) {
      overlay.innerHTML = html;
    }
  }

  // --------------------------------------------------------------------------
  // Match Lifecycle: Start, Continue, Save, Replay, Analyze
  // --------------------------------------------------------------------------
  openMatchSetup(mode = GameMode.AI) {
    SoundSystem.playClick();
    this.setupForm.mode = mode;
    this.setupForm.theme = this.settings.board.theme;
    this.setupForm.pieceSet = this.settings.board.pieceSet;
    this.setupForm.whitePieceColor = this.settings.board.whitePieceColor;
    this.setupForm.blackPieceColor = this.settings.board.blackPieceColor;
    this.setupForm.environment = this.settings.board.environment;
    this.activeModal = 'SETUP';
    this.renderUI();
  }

  startNewGameFromSetup() {
    SoundSystem.playClick();
    const f = this.setupForm;

    let startFen = STANDARD_START_FEN;
    if (f.mode === GameMode.CUSTOM && f.customFen.trim()) {
      const check = validateFen(f.customFen.trim());
      if (!check.valid) {
        this.showToast(`Invalid FEN: ${check.error}`);
        return;
      }
      startFen = f.customFen.trim();
    }

    // Apply chosen board visual preferences to settings
    this.settings = SettingsStorage.updateCategory('board', {
      theme: f.theme,
      pieceSet: f.pieceSet,
      whitePieceColor: f.whitePieceColor,
      blackPieceColor: f.blackPieceColor,
      environment: f.environment,
    });
    this._applySettingsClasses();

    let resolvedColor = f.playerColor;
    if (resolvedColor === 'random') {
      resolvedColor = Math.random() < 0.5 ? 'w' : 'b';
    }

    const tcPreset =
      TimeControlPresets.find((t) => t.id === f.timeControl) || TimeControlPresets[7];
    const initialMs = tcPreset.initialSeconds * 1000;

    const whiteName =
      f.mode === GameMode.AI
        ? resolvedColor === 'w'
          ? this.profile.username
          : `AI (${f.aiDifficulty})`
        : f.mode === GameMode.AI_VS_AI
        ? `AI White (${f.aiDifficulty})`
        : `${this.profile.username} (White)`;

    const blackName =
      f.mode === GameMode.AI
        ? resolvedColor === 'b'
          ? this.profile.username
          : `AI (${f.aiDifficulty})`
        : f.mode === GameMode.AI_VS_AI
        ? `AI Black (${f.aiDifficulty})`
        : 'Player 2 (Black)';

    this.engine.reset(startFen);
    this.reviewMoveIndex = null;
    this.reviewEngine = null;
    this.stopReplay();
    this.activeAnalysis = null;
    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this.pendingPromotionMove = null;
    this.pendingConfirmMove = null;
    this.pendingDrawOfferFrom = null;
    this.showResultOverlay = false;
    this.currentEvalCp = evaluatePositionWhiteCp(this.engine);

    this.currentGame = createGameRecord({
      gameNumber: GameStorage.getNextGameNumber(),
      whitePlayer: whiteName,
      blackPlayer: blackName,
      playerColor: resolvedColor,
      mode: f.mode,
      startingFen: startFen,
      finalFen: startFen,
      pgn: this.engine.pgn({ White: whiteName, Black: blackName }),
      moves: [],
      timeControl: f.timeControl,
      whiteTimeRemainingMs: initialMs,
      blackTimeRemainingMs: initialMs,
      duration: 0,
      moveCount: 0,
      aiDifficulty: f.aiDifficulty,
      theme: f.theme,
      pieceSet: f.pieceSet,
      whitePieceColor: f.whitePieceColor,
      blackPieceColor: f.blackPieceColor,
      environment: f.environment,
      status: 'in_progress',
    });

    if (this.settings.gameplay.autoSave) {
      GameStorage.saveGame(this.currentGame);
    }

    this.activeModal = null;
    this.screen = 'GAME';
    this.gameState = GameState.PLAYER_TURN;
    this.lastClockTick = performance.now();

    const perspective = f.mode === GameMode.AI ? resolvedColor : 'w';
    this.scene3D.resetCamera(perspective);
    this._sync3DScene();
    this.renderUI();

    this._checkAndTriggerAIMoveIfNeeded();
  }

  continueSavedGame(gameId) {
    SoundSystem.playClick();
    const record = GameStorage.getById(gameId);
    if (!record) {
      this.showToast('Could not load saved game.');
      return;
    }

    this.engine.reset(record.startingFen || STANDARD_START_FEN);
    for (const m of record.moves || []) {
      this.engine.move(m.san || { from: m.from, to: m.to, promotion: m.promotion });
    }

    this.currentGame = { ...record };
    this.reviewMoveIndex = null;
    this.reviewEngine = null;
    this.stopReplay();
    this.activeAnalysis = record.analysis || null;
    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this.pendingPromotionMove = null;
    this.pendingConfirmMove = null;
    this.showResultOverlay = record.status === 'completed';
    this.currentEvalCp = evaluatePositionWhiteCp(this.engine);

    this.activeModal = null;
    this.screen = 'GAME';
    this.gameState =
      record.status === 'completed' ? GameState.FINISHED : GameState.PLAYER_TURN;
    this.lastClockTick = performance.now();

    this.scene3D.resetCamera(record.playerColor || 'w');
    this._sync3DScene();
    this.renderUI();

    if (record.status === 'in_progress') {
      this._checkAndTriggerAIMoveIfNeeded();
    }
  }

  startReplayGame(gameId) {
    SoundSystem.playClick();
    const record = GameStorage.getById(gameId);
    if (!record) return;

    this.continueSavedGame(gameId);
    this.gameState = GameState.REPLAY;
    this.showResultOverlay = false;
    this.jumpToHistoryMove(0);
    this.toggleReplayPlay(true);
  }

  async runGameAnalysis(gameId = null) {
    SoundSystem.playClick();
    const targetRecord = gameId ? GameStorage.getById(gameId) : this.currentGame;
    if (!targetRecord || !targetRecord.moves || targetRecord.moves.length === 0) {
      this.showToast('Play at least one move before analyzing a game.');
      return;
    }

    if (gameId && (!this.currentGame || this.currentGame.id !== gameId)) {
      this.continueSavedGame(gameId);
    }

    this.showResultOverlay = false;
    this.activeModal = null;
    this.screen = 'GAME';
    this.showToast('Analyzing game moves with Tactical Engine...');

    const analysisResult = await ChessAI.analyzeGameAsync(
      targetRecord.startingFen,
      targetRecord.moves
    );
    if (!analysisResult) {
      this.showToast('Analysis could not be completed.');
      return;
    }

    this.activeAnalysis = analysisResult;
    if (this.currentGame) {
      this.currentGame.analysis = analysisResult;
      GameStorage.saveGame(this.currentGame);
    }

    // Jump to last move or first critical moment
    const firstCritical = analysisResult.criticalMoments[0];
    if (firstCritical) {
      this.jumpToHistoryMove(firstCritical.index + 1);
    } else {
      this.jumpToHistoryMove(targetRecord.moves.length);
    }
    this._sync3DScene();
    this.renderUI();
    this.showToast(
      `Analysis Complete — White: ${analysisResult.whiteAccuracy}% | Black: ${analysisResult.blackAccuracy}%`
    );
  }

  // --------------------------------------------------------------------------
  // Interactive Board Click & Move Execution
  // --------------------------------------------------------------------------
  handleSquareClick(square) {
    if (this.screen === 'PUZZLES') {
      this._handlePuzzleSquareClick(square);
      return;
    }
    if (this.screen !== 'GAME' || !this.currentGame) return;

    // If user is reviewing an earlier move during an active game, prevent state corruption
    if (this.reviewMoveIndex !== null) {
      if (this.currentGame.status === 'in_progress') {
        this.showToast('Viewing historical move — click "Return to Live Game" to make a move.');
      }
      return;
    }

    if (
      this.currentGame.status !== 'in_progress' ||
      this.gameState === GameState.AI_THINKING ||
      this.gameState === GameState.FINISHED ||
      this.gameState === GameState.CHECKMATE ||
      this.gameState === GameState.DRAW
    ) {
      return;
    }

    // In Play vs AI, prevent player from moving AI's pieces
    if (
      this.currentGame.mode === GameMode.AI &&
      this.engine.turn !== this.currentGame.playerColor
    ) {
      return;
    }
    if (this.currentGame.mode === GameMode.AI_VS_AI) {
      return;
    }

    // Check if clicked square is a legal destination for the currently selected piece
    if (this.selectedSquare) {
      const candidateMoves = this.legalMovesForSelected.filter((m) => m.to === square);
      if (candidateMoves.length > 0) {
        // Check if this is a pawn promotion
        const isPromo = candidateMoves.some((m) => Boolean(m.promotion));
        if (isPromo && !this.settings.gameplay.autoQueenPromotion) {
          this.pendingPromotionMove = {
            from: this.selectedSquare,
            to: square,
            color: this.engine.turn,
          };
          this.renderUI();
          return;
        }

        const chosenMove =
          candidateMoves.find((m) => m.promotion === 'q') || candidateMoves[0];

        if (this.settings.gameplay.confirmMove) {
          this.pendingConfirmMove = chosenMove;
          this.renderUI();
          return;
        }

        this._executeMoveOnBoard(chosenMove);
        return;
      }
    }

    // Otherwise check if user clicked a friendly piece to select it
    const clickedPiece = this.engine.getPiece(square);
    if (clickedPiece && clickedPiece.color === this.engine.turn) {
      SoundSystem.playClick();
      this.selectedSquare = square;
      this.legalMovesForSelected = this.engine.getLegalMoves(square);
    } else {
      this.selectedSquare = null;
      this.legalMovesForSelected = [];
    }

    this._sync3DScene();
    this.renderUI();
  }

  confirmPendingMove() {
    if (!this.pendingConfirmMove) return;
    const mv = this.pendingConfirmMove;
    this.pendingConfirmMove = null;
    this._executeMoveOnBoard(mv);
  }

  cancelPendingMove() {
    this.pendingConfirmMove = null;
    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this._sync3DScene();
    this.renderUI();
  }

  completePromotionChoice(promoPiece) {
    if (!this.pendingPromotionMove) return;
    const { from, to } = this.pendingPromotionMove;
    this.pendingPromotionMove = null;
    this._executeMoveOnBoard({ from, to, promotion: promoPiece });
  }

  _executeMoveOnBoard(moveInput) {
    const moveRecord = this.engine.move(moveInput);
    if (!moveRecord) return false;

    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this.pendingDrawOfferFrom = null;

    // Add clock increment for the side that just moved
    if (this.currentGame) {
      const tc = TimeControlPresets.find((t) => t.id === this.currentGame.timeControl);
      if (tc && tc.initialSeconds > 0 && tc.incrementSeconds > 0) {
        if (moveRecord.color === 'w') {
          this.currentGame.whiteTimeRemainingMs += tc.incrementSeconds * 1000;
        } else {
          this.currentGame.blackTimeRemainingMs += tc.incrementSeconds * 1000;
        }
      }
    }

    // Play appropriate audio cue
    const status = this.engine.getGameStatus();
    if (status.status === 'CHECKMATE') {
      SoundSystem.playCheckmate();
    } else if (status.status === 'CHECK') {
      SoundSystem.playCheck();
    } else if (moveRecord.promotion) {
      SoundSystem.playPromotion();
    } else if (moveRecord.flags === 'k' || moveRecord.flags === 'q') {
      SoundSystem.playCastle();
    } else if (moveRecord.captured) {
      SoundSystem.playCapture();
    } else {
      SoundSystem.playMove();
    }

    // Animate 3D piece & optional cinematic Auto-Camera
    this.scene3D.animateMove(moveRecord);
    this.scene3D.triggerAutoCameraMove(
      moveRecord,
      this.engine.turn,
      this.currentGame?.mode,
      this.currentGame?.playerColor
    );

    this.currentEvalCp = evaluatePositionWhiteCp(this.engine);

    // Update currentGame record & persist immediately (Auto-Save after every move)
    if (this.currentGame) {
      const serializedMoves = this.engine.history.map((h) => ({
        san: h.san,
        from: h.from,
        to: h.to,
        piece: h.piece,
        color: h.color,
        captured: h.captured || null,
        promotion: h.promotion || null,
        flags: h.flags,
        fenAfter: h.fenAfter,
        moveNumber: h.moveNumber,
        timestamp: h.timestamp,
      }));

      this.currentGame.moves = serializedMoves;
      this.currentGame.moveCount = serializedMoves.length;
      this.currentGame.finalFen = this.engine.fen();

      if (status.over) {
        this.currentGame.status = 'completed';
        this.currentGame.result = status.result;
        this.currentGame.winner = status.winner;
        this.currentGame.terminationReason = status.reason;
        this.gameState =
          status.status === 'CHECKMATE' ? GameState.CHECKMATE : GameState.DRAW;
        this.showResultOverlay = true;
      } else {
        this.gameState =
          status.status === 'CHECK' ? GameState.CHECK : GameState.PLAYER_TURN;
      }

      this.currentGame.pgn = this.engine.pgn({
        White: this.currentGame.whitePlayer,
        Black: this.currentGame.blackPlayer,
        Result: this.currentGame.result,
      });

      if (this.settings.gameplay.autoSave || status.over) {
        GameStorage.saveGame(this.currentGame);
      }

      // Evaluate Achievements
      const stats = ProfileStorage.getComputedStats();
      const puzData = PuzzleStorage.load();
      const unlocked = AchievementStorage.evaluateAfterMoveOrGame({
        move: moveRecord,
        gameRecord: this.currentGame,
        stats,
        puzzlesSolvedCount: puzData.solvedIds.length,
      });
      for (const ach of unlocked) {
        this.showToast(`Achievement Unlocked: ${ach.title}!`);
      }
    }

    this._sync3DScene();
    this.renderUI();

    if (!status.over) {
      this._checkAndTriggerAIMoveIfNeeded();
    }
    return true;
  }

  async _checkAndTriggerAIMoveIfNeeded() {
    if (!this.currentGame || this.currentGame.status !== 'in_progress') return;
    if (this.screen !== 'GAME') return;

    const isAITurn =
      (this.currentGame.mode === GameMode.AI &&
        this.engine.turn !== this.currentGame.playerColor) ||
      this.currentGame.mode === GameMode.AI_VS_AI;

    if (!isAITurn) return;

    this.gameState = GameState.AI_THINKING;
    this.renderUI();

    const fenSnapshot = this.engine.fen();
    const res = await ChessAI.computeNextMove(
      fenSnapshot,
      this.currentGame.aiDifficulty || AIDifficulty.MEDIUM
    );

    // Ensure match hasn't been exited or undone while AI was thinking
    if (
      !this.currentGame ||
      this.currentGame.status !== 'in_progress' ||
      this.engine.fen() !== fenSnapshot ||
      this.screen !== 'GAME'
    ) {
      return;
    }

    if (res && res.bestMove) {
      this.currentEvalCp = res.evalCp ?? this.currentEvalCp;
      this._executeMoveOnBoard(res.bestMove);
    }
  }

  // --------------------------------------------------------------------------
  // Undo, Resign, Offer/Accept Draw, Clocks
  // --------------------------------------------------------------------------
  handleUndoMove() {
    if (!this.currentGame || this.currentGame.status !== 'in_progress') return;
    if (this.gameState === GameState.AI_THINKING) return;
    if (this.engine.history.length === 0) return;

    SoundSystem.playClick();
    this.reviewMoveIndex = null;
    this.reviewEngine = null;

    if (
      this.currentGame.mode === GameMode.AI &&
      this.engine.turn === this.currentGame.playerColor &&
      this.engine.history.length >= 2
    ) {
      // Undo both AI reply and player's last move so it returns to player's turn
      this.engine.undo();
      this.engine.undo();
    } else {
      this.engine.undo();
    }

    this.selectedSquare = null;
    this.legalMovesForSelected = [];
    this.currentEvalCp = evaluatePositionWhiteCp(this.engine);

    this.currentGame.moves = this.engine.history.map((h) => ({
      san: h.san,
      from: h.from,
      to: h.to,
      piece: h.piece,
      color: h.color,
      captured: h.captured || null,
      promotion: h.promotion || null,
      flags: h.flags,
      fenAfter: h.fenAfter,
      moveNumber: h.moveNumber,
      timestamp: h.timestamp,
    }));
    this.currentGame.moveCount = this.currentGame.moves.length;
    this.currentGame.finalFen = this.engine.fen();
    GameStorage.saveGame(this.currentGame);

    this._sync3DScene();
    this.renderUI();
  }

  handleResign() {
    if (!this.currentGame || this.currentGame.status !== 'in_progress') return;
    SoundSystem.playDefeat();

    const resigningColor =
      this.currentGame.mode === GameMode.AI
        ? this.currentGame.playerColor
        : this.engine.turn;
    const winner = resigningColor === 'w' ? 'b' : 'w';

    this.currentGame.status = 'completed';
    this.currentGame.winner = winner;
    this.currentGame.result = winner === 'w' ? '1-0' : '0-1';
    this.currentGame.terminationReason = 'Resignation';
    this.currentGame.pgn = this.engine.pgn({
      White: this.currentGame.whitePlayer,
      Black: this.currentGame.blackPlayer,
      Result: this.currentGame.result,
    });

    GameStorage.saveGame(this.currentGame);
    this.gameState = GameState.FINISHED;
    this.showResultOverlay = true;
    this.renderUI();
  }

  handleOfferDraw() {
    if (!this.currentGame || this.currentGame.status !== 'in_progress') return;
    SoundSystem.playClick();

    if (this.currentGame.mode === GameMode.LOCAL || this.currentGame.mode === GameMode.CUSTOM) {
      this.pendingDrawOfferFrom = this.engine.turn;
      this.renderUI();
    } else if (this.currentGame.mode === GameMode.AI) {
      // AI accepts draw if evaluation is roughly balanced (within 1.2 pawns) after at least 10 moves
      if (this.engine.history.length >= 10 && Math.abs(this.currentEvalCp) <= 120) {
        this.acceptDrawOffer();
      } else {
        this.showToast('AI declined the draw offer and wants to play on!');
      }
    }
  }

  acceptDrawOffer() {
    if (!this.currentGame) return;
    SoundSystem.playClick();
    this.pendingDrawOfferFrom = null;
    this.currentGame.status = 'completed';
    this.currentGame.winner = 'draw';
    this.currentGame.result = '1/2-1/2';
    this.currentGame.terminationReason = 'Draw by Agreement';
    this.currentGame.pgn = this.engine.pgn({
      White: this.currentGame.whitePlayer,
      Black: this.currentGame.blackPlayer,
      Result: '1/2-1/2',
    });
    GameStorage.saveGame(this.currentGame);
    this.gameState = GameState.DRAW;
    this.showResultOverlay = true;
    this.renderUI();
  }

  declineDrawOffer() {
    SoundSystem.playClick();
    this.pendingDrawOfferFrom = null;
    this.showToast('Draw offer declined.');
    this.renderUI();
  }

  _startClockLoop() {
    this.lastClockTick = performance.now();
    this.clockInterval = setInterval(() => {
      const now = performance.now();
      const dtMs = now - this.lastClockTick;
      this.lastClockTick = now;

      if (
        this.screen !== 'GAME' ||
        !this.currentGame ||
        this.currentGame.status !== 'in_progress' ||
        this.gameState === GameState.PAUSED ||
        this.gameState === GameState.REPLAY
      ) {
        return;
      }

      // Accumulate match duration in seconds
      this._durationCarry = (this._durationCarry || 0) + dtMs;
      if (this._durationCarry >= 1000) {
        const addSec = Math.floor(this._durationCarry / 1000);
        this._durationCarry -= addSec * 1000;
        this.currentGame.duration = (this.currentGame.duration || 0) + addSec;
      }

      const tc = TimeControlPresets.find((t) => t.id === this.currentGame.timeControl);
      if (!tc || tc.initialSeconds === 0) return;

      if (this.engine.turn === 'w') {
        this.currentGame.whiteTimeRemainingMs = Math.max(
          0,
          this.currentGame.whiteTimeRemainingMs - dtMs
        );
        if (this.currentGame.whiteTimeRemainingMs <= 0) {
          this._handleTimeForfeit('w');
          return;
        }
      } else {
        this.currentGame.blackTimeRemainingMs = Math.max(
          0,
          this.currentGame.blackTimeRemainingMs - dtMs
        );
        if (this.currentGame.blackTimeRemainingMs <= 0) {
          this._handleTimeForfeit('b');
          return;
        }
      }

      // Targeted DOM update for clock boxes so we don't rebuild the entire UI every 200ms
      const wClockEl = document.getElementById('clock-w');
      const bClockEl = document.getElementById('clock-b');
      if (wClockEl) {
        wClockEl.textContent = formatClockMs(this.currentGame.whiteTimeRemainingMs, false);
        wClockEl.classList.toggle('clock-low', this.currentGame.whiteTimeRemainingMs < 30000);
      }
      if (bClockEl) {
        bClockEl.textContent = formatClockMs(this.currentGame.blackTimeRemainingMs, false);
        bClockEl.classList.toggle('clock-low', this.currentGame.blackTimeRemainingMs < 30000);
      }
    }, 200);
  }

  _handleTimeForfeit(flaggedColor) {
    const winner = flaggedColor === 'w' ? 'b' : 'w';
    SoundSystem.playDefeat();
    this.currentGame.status = 'completed';
    this.currentGame.winner = winner;
    this.currentGame.result = winner === 'w' ? '1-0' : '0-1';
    this.currentGame.terminationReason = 'Time Forfeit';
    GameStorage.saveGame(this.currentGame);
    this.gameState = GameState.FINISHED;
    this.showResultOverlay = true;
    this.renderUI();
  }

  // --------------------------------------------------------------------------
  // Move History Review & Replay Controller
  // --------------------------------------------------------------------------
  jumpToHistoryMove(moveCountIndex) {
    if (!this.currentGame) return;
    const total = this.currentGame.moves.length;
    const clamped = Math.max(0, Math.min(total, moveCountIndex));

    if (clamped === total && this.currentGame.status === 'in_progress' && this.gameState !== GameState.REPLAY) {
      // Return to live active board
      this.reviewMoveIndex = null;
      this.reviewEngine = null;
      this._sync3DScene();
      this.renderUI();
      return;
    }

    this.reviewMoveIndex = clamped;
    this.reviewEngine = new ChessEngine(this.currentGame.startingFen || STANDARD_START_FEN);
    let lastPlayed = null;
    for (let i = 0; i < clamped; i++) {
      const m = this.currentGame.moves[i];
      lastPlayed = this.reviewEngine.move(m.san || { from: m.from, to: m.to, promotion: m.promotion });
    }
    if (lastPlayed) {
      this.scene3D.animateMove(lastPlayed);
      SoundSystem.playMove();
    }
    this.currentEvalCp = evaluatePositionWhiteCp(this.reviewEngine);
    this._sync3DScene();
    this.renderUI();
  }

  returnToLiveGame() {
    this.stopReplay();
    this.reviewMoveIndex = null;
    this.reviewEngine = null;
    this._sync3DScene();
    this.renderUI();
  }

  toggleReplayPlay(forceState = null) {
    const nextState = forceState !== null ? forceState : !this.replayPlaying;
    if (!nextState) {
      this.stopReplay();
      this.renderUI();
      return;
    }
    if (!this.currentGame || !this.currentGame.moves.length) return;
    this.replayPlaying = true;
    if (this.reviewMoveIndex === null || this.reviewMoveIndex >= this.currentGame.moves.length) {
      this.jumpToHistoryMove(0);
    }
    this._scheduleNextReplayStep();
    this.renderUI();
  }

  _scheduleNextReplayStep() {
    if (this.replayTimer) clearTimeout(this.replayTimer);
    if (!this.replayPlaying || !this.currentGame) return;
    const interval = Math.round(950 / (this.replaySpeed || 1));
    this.replayTimer = setTimeout(() => {
      if (!this.replayPlaying || !this.currentGame) return;
      const cur = this.reviewMoveIndex ?? 0;
      if (cur < this.currentGame.moves.length) {
        this.jumpToHistoryMove(cur + 1);
        this._scheduleNextReplayStep();
      } else {
        this.stopReplay();
        this.renderUI();
      }
    }, interval);
  }

  stopReplay() {
    this.replayPlaying = false;
    if (this.replayTimer) {
      clearTimeout(this.replayTimer);
      this.replayTimer = null;
    }
  }

  setReplaySpeed(speed) {
    this.replaySpeed = speed;
    if (this.replayPlaying) {
      this._scheduleNextReplayStep();
    }
    this.renderUI();
  }

  // --------------------------------------------------------------------------
  // Puzzle Mode Flow
  // --------------------------------------------------------------------------
  openPuzzleMode(puzzle = null) {
    SoundSystem.playClick();
    this.stopReplay();
    this.activeModal = null;
    this.screen = 'PUZZLES';
    const targetPuzzle =
      puzzle ||
      BUILTIN_PUZZLES.find(
        (p) => this.puzzleCategory === 'All' || p.category === this.puzzleCategory
      ) ||
      BUILTIN_PUZZLES[0];

    this.currentPuzzle = targetPuzzle;
    this.puzzleStepIndex = 0;
    this.puzzleStatus = 'solving';
    this.puzzleShowHint = false;
    this.puzzleMessage = targetPuzzle.description;

    this.engine.reset(targetPuzzle.fen);
    this.reviewMoveIndex = null;
    this.reviewEngine = null;
    this.selectedSquare = null;
    this.legalMovesForSelected = [];

    this.scene3D.resetCamera(this.engine.turn);
    this._sync3DScene();
    this.renderUI();
  }

  _handlePuzzleSquareClick(square) {
    if (this.puzzleStatus === 'correct') return;

    if (this.selectedSquare) {
      const candidateMoves = this.legalMovesForSelected.filter((m) => m.to === square);
      if (candidateMoves.length > 0) {
        const chosen = candidateMoves.find((m) => m.promotion === 'q') || candidateMoves[0];
        const expectedSan = this.currentPuzzle.solution[this.puzzleStepIndex];
        const cleanExpected = expectedSan.replace(/[+#]/g, '');
        const cleanChosen = chosen.san.replace(/[+#]/g, '');

        if (chosen.san === expectedSan || cleanChosen === cleanExpected) {
          const mv = this.engine.move(chosen);
          this.scene3D.animateMove(mv);
          SoundSystem.playMove();
          this.selectedSquare = null;
          this.legalMovesForSelected = [];
          this.puzzleStepIndex++;

          if (this.puzzleStepIndex >= this.currentPuzzle.solution.length) {
            this.puzzleStatus = 'correct';
            this.puzzleMessage = ' Brilliant! Puzzle solved!';
            SoundSystem.playVictory();
            const puzData = PuzzleStorage.recordAttempt(this.currentPuzzle.id, true);
            const unlocked = AchievementStorage.evaluateAfterMoveOrGame({
              puzzlesSolvedCount: puzData.solvedIds.length,
            });
            for (const ach of unlocked) {
              this.showToast(`Achievement Unlocked: ${ach.title}!`);
            }
          } else {
            this.puzzleMessage = 'Great move! Keep going...';
            // Play opponent's forced puzzle response after a short beat
            setTimeout(() => {
              const replySan = this.currentPuzzle.solution[this.puzzleStepIndex];
              if (replySan) {
                const repMv = this.engine.move(replySan);
                if (repMv) {
                  this.scene3D.animateMove(repMv);
                  SoundSystem.playMove();
                  this.puzzleStepIndex++;
                  this._sync3DScene();
                  this.renderUI();
                }
              }
            }, 420);
          }
          this._sync3DScene();
          this.renderUI();
          return;
        } else {
          // Wrong tactical move
          SoundSystem.playDefeat();
          PuzzleStorage.recordAttempt(this.currentPuzzle.id, false);
          this.puzzleStatus = 'wrong';
          this.puzzleMessage = `Not quite (${chosen.san}). Try again or view the hint!`;
          this.selectedSquare = null;
          this.legalMovesForSelected = [];
          this._sync3DScene();
          this.renderUI();
          return;
        }
      }
    }

    const clickedPiece = this.engine.getPiece(square);
    if (clickedPiece && clickedPiece.color === this.engine.turn) {
      SoundSystem.playClick();
      this.selectedSquare = square;
      this.legalMovesForSelected = this.engine.getLegalMoves(square);
    } else {
      this.selectedSquare = null;
      this.legalMovesForSelected = [];
    }
    this._sync3DScene();
    this.renderUI();
  }

  // --------------------------------------------------------------------------
  // Global Keyboard Shortcuts
  // --------------------------------------------------------------------------
  _bindGlobalShortcuts() {
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.key === 'Escape') {
        if (this.activeModal) {
          this.activeModal = null;
          this.renderUI();
        } else if (this.pendingPromotionMove) {
          this.pendingPromotionMove = null;
          this.renderUI();
        }
      } else if (e.key === 'r' || e.key === 'R') {
        this.scene3D.resetCamera(this.currentGame?.playerColor || 'w');
        this.showToast('Camera Reset');
      } else if (e.key === 'f' || e.key === 'F') {
        this.toggleFullscreenZen();
      } else if (e.key === 'm' || e.key === 'M') {
        const nextMute = !this.settings.audio.muted;
        this.settings = SettingsStorage.updateCategory('audio', { muted: nextMute });
        SoundSystem.syncMusicState();
        this.showToast(nextMute ? 'Audio Muted' : 'Audio Unmuted');
        this.renderUI();
      } else if (e.key === 'ArrowLeft' && this.screen === 'GAME' && this.currentGame) {
        e.preventDefault();
        const cur = this.reviewMoveIndex ?? this.currentGame.moves.length;
        this.jumpToHistoryMove(Math.max(0, cur - 1));
      } else if (e.key === 'ArrowRight' && this.screen === 'GAME' && this.currentGame) {
        e.preventDefault();
        const cur = this.reviewMoveIndex ?? this.currentGame.moves.length;
        this.jumpToHistoryMove(Math.min(this.currentGame.moves.length, cur + 1));
      } else if (e.key === ' ' && this.screen === 'GAME' && this.currentGame) {
        e.preventDefault();
        this.toggleReplayPlay();
      } else if (['1', '2', '3', '4', '5', '6'].includes(e.key)) {
        const preset = Object.values(CameraPresets).find((p) => p.key === e.key);
        if (preset) {
          this.scene3D.setCameraPreset(preset.id, this.currentGame?.playerColor || 'w');
          this.showToast(`Camera: ${preset.name}`);
        }
      }
    });
  }

  toggleFullscreenZen() {
    const isZen = document.body.classList.toggle('fullscreen-zen');
    if (isZen && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (!isZen && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    this.showToast(isZen ? 'Fullscreen Zen Mode ON (Press F to exit)' : 'Fullscreen Zen Mode OFF');
  }

  _computeCapturedAndMaterial(dispEngine) {
    const startCounts = { p: 8, n: 2, b: 2, r: 2, q: 1 };
    const current = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
    for (const p of dispEngine.getBoardPieces()) {
      if (current[p.color] && current[p.color][p.type] !== undefined) {
        current[p.color][p.type]++;
      }
    }
    const capturedByWhite = []; // Black pieces captured by White
    const capturedByBlack = []; // White pieces captured by Black
    let whiteMat = 0;
    let blackMat = 0;

    for (const t of ['q', 'r', 'b', 'n', 'p']) {
      whiteMat += current.w[t] * PIECE_VALUES[t];
      blackMat += current.b[t] * PIECE_VALUES[t];
      const missingBlack = Math.max(0, startCounts[t] - current.b[t]);
      for (let i = 0; i < missingBlack; i++) capturedByWhite.push(UNICODE_PIECES.b[t]);
      const missingWhite = Math.max(0, startCounts[t] - current.w[t]);
      for (let i = 0; i < missingWhite; i++) capturedByBlack.push(UNICODE_PIECES.w[t]);
    }
    const diff = Math.round((whiteMat - blackMat) / 100);
    return { capturedByWhite, capturedByBlack, diff };
  }

  _renderGameHUD() {

    const g = this.currentGame;
    const dispEngine = this._getActiveDisplayEngine();
    const status = dispEngine.getGameStatus();
    const { capturedByWhite, capturedByBlack, diff } = this._computeCapturedAndMaterial(dispEngine);
    const isUnlimited = g.timeControl === 'unlimited';

    // White advantage % for Evaluation Bar
    const clampedCp = Math.max(-1000, Math.min(1000, this.currentEvalCp));
    const whiteBarPct = Math.round(50 + (clampedCp / 1000) * 45);
    const evalLabel =
      Math.abs(this.currentEvalCp) > 9000
        ? this.currentEvalCp > 0
          ? '+M'

        : `${this.currentEvalCp >= 0 ? '+' : ''}${(this.currentEvalCp / 100).toFixed(1)}`;

    // Status Banner Text
    let statusDotClass = 'status-dot';
    let statusText = `${dispEngine.turn === 'w' ? 'White' : 'Black'} to move`;
    if (this.gameState === GameState.AI_THINKING) {
      statusDotClass = 'status-dot thinking';
      statusText = `AI (${g.aiDifficulty}) is thinking...`;
    } else if (status.status === 'CHECKMATE') {
      statusDotClass = 'status-dot check';
      statusText = `CHECKMATE — ${status.winner === 'w' ? 'White' : 'Black'} Wins!`;
    } else if (status.status === 'DRAW') {

    // Build move pairs (1. e4 e5)

    for (let i = 0; i < g.moves.length; i += 2) {

        moveNumber: Math.floor(i / 2) + 1,

          <!-- White Player Card -->

            <div class="player-info">
              <div class="player-name-row">
                <span class="color-swatch-dot" style="background:#f8fafc"></span>

                ${diff > 0 ? `<span class="badge badge-active">+${diff}</span>` : ''}

        <div class="hud-right-col">

            </div>

            <div class="move-list-scroll" id="move-history-scroll">
              ${
                movePairs.length === 0
                  ? `<div style="color:var(--text-muted);padding:12px 4px;">Click any piece on the 3D board to make the opening move.</div>`
                  : movePairs
                      .map((pair) => {
                        const wAnal = this.activeAnalysis?.moves?.[pair.whiteIdx];
                        const bAnal = pair.black ? this.activeAnalysis?.moves?.[pair.blackIdx] : null;
                        return `
                          <div class="move-pair-row">
                            <span class="move-num">${pair.moveNumber}.</span>
                            <button class="move-san-btn ${activeMoveIdx === pair.whiteIdx ? 'current-move' : ''}" data-action="jump-move" data-index="${pair.whiteIdx + 1}">
                              <span>${escapeHtml(pair.white.san)}</span>
                              ${wAnal ? `<span style="font-size:9px;color:var(--accent-gold)">[${wAnal.classification.split(' ')[0]}]</span>` : ''}
                            </button>
                            ${

                                    <span>${escapeHtml(pair.black.san)}</span>
                                    ${bAnal ? `<span style="font-size:9px;color:var(--accent-gold)">[${bAnal.classification.split(' ')[0]}]</span>` : ''}

                <button class="btn btn-sm btn-gold" data-action="toggle-replay" title="Play/Pause Replay (Space)">

              { type: 'n', label: 'Knight' },

              .map(
                (p) => `
              <button class="btn btn-gold" style="flex-direction:column;padding:10px;" data-action="promote-select" data-piece="${p.type}">
                <span style="font-size:24px">${UNICODE_PIECES[c][p.type]}</span>

              .join('')}

    if (this.pendingConfirmMove) {
      return `
        <div class="interactive-panel hud-section-card" style="flex-direction:row;align-items:center;gap:12px;padding:12px 18px;">
          <span>Confirm Move <strong>${escapeHtml(this.pendingConfirmMove.san)}</strong>?</span>

    // 3. Local 2-Player Draw Offer Prompt
    if (this.pendingDrawOfferFrom) {

      return `
        <div class="interactive-panel hud-section-card" style="flex-direction:row;align-items:center;gap:12px;padding:12px 18px;">
          <span><strong>${offeringSide}</strong> offers a draw. <strong>${respondingSide}</strong>, do you accept?</span>

    // 4. Victory / Match Result Overlay Card
